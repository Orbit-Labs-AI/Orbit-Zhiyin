name: Bug 报告
description: 报告 Orbit 中可复现的问题（安全问题请私下报告）。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 Issues。安全问题请按 [安全政策](https://github.com/Orbit-Labs-AI/Orbit/blob/main/SECURITY.md) 私下报告。
        只上传构造或脱敏样本；不要上传真实会话、数据库、密钥、个人路径或隐私截图。
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: 提交 SHA、macOS / 其他系统版本，以及相关 Python、Node、浏览器版本。
      placeholder: "例如：提交 abc1234，macOS，Python 3.13，Node 24.x"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 说明模块或页面、命令、输入和步骤；样本需构造或脱敏。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏后的报错、日志片段或截图。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据检查
      options:
        - label: 已确认正文与附件不包含真实会话、密钥或个人隐私数据。
          required: true
