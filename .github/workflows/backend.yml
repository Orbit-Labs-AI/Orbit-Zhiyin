name: Backend checks

on:
  pull_request:
  push:
    branches: ['feat/**', 'fix/**', 'refactor/**']

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.8'
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: uv sync --locked --all-packages --dev
      - run: pnpm --dir packages/connectors install --frozen-lockfile
      - run: pnpm --dir packages/connectors check
      - run: uv run --no-sync ruff check src tests packages/data/src packages/data/tests
      - run: uv run --no-sync ruff format --check packages/data/src packages/data/tests
      - run: uv run --no-sync pytest -q tests
      - run: uv run --no-sync pytest -q packages/data/tests
      - run: uv build --all-packages
      - run: uv run --no-sync tandem demo
      - run: uv run --no-sync tandem evaluate
