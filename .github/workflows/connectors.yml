name: Connector runtime matrix
on:
  pull_request:
    paths: ['packages/connectors/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.github/workflows/connectors.yml']
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
    paths: ['packages/connectors/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.github/workflows/connectors.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tandem/connectors check
      - run: node packages/connectors/dist/cli.js --help
