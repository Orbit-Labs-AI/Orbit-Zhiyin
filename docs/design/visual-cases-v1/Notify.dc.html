<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"外观"},"$preview":{"width":1420,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const L = {
      ts: { level: '时效性', lc: 'var(--warn)', shape: '2px', why: '需要你动作；等待 5 分钟后才发，可在授权后突破专注模式。' },
      act: { level: '主动', lc: 'var(--pg-ink)', shape: '50%', why: '带来明确结果；短于 10 分钟的会话不通知。' },
      pas: { level: '被动', lc: 'var(--pg-ink-3)', shape: '50%', why: '静默送达通知中心，不弹横幅。' }
    };
    const raw = [
      ['ts', 'Codex 请求执行 git push', '5 分钟前', 'team-hub · 已等待 5 分钟。Orbit 不会代你批准，点按跳到对应终端。', '在终端中处理', ''],
      ['act', '会话完成：部署 Confluo 演示', '现在', 'Claude Code · 42 分钟 · 186 步 · 2 次纠偏。线上验证已通过。', '查看轨迹', '好'],
      ['act', '你的协作周报', '周一 09:00', '本周你仍是「指挥家」，并发度 ↑9。最值得做的一件事：只读命令自动放行。', '打开报告', ''],
      ['pas', 'retry-breaker 已生效 7 天', '昨天', '重复失败 −68%，约省 41 分钟。保留还是撤销？', '保留', '撤销…'],
      ['pas', '发现新的数据来源', '9/28', '检测到 Cursor 会话数据。是否加入分析？默认不加入。', '加入', '忽略']
    ];
    const items = raw.map(r => ({
      t: r[1], when: r[2], b: r[3], a1: r[4], a2: r[5], has2: !!r[5],
      level: L[r[0]].level, lc: L[r[0]].lc, shape: L[r[0]].shape, why: L[r[0]].why
    }));
    const matrix = [
      ['需要你确认（≥ 5 分钟）', '✓', '✓', '✓'],
      ['会话完成（≥ 10 分钟）', '✓', '✓', '—'],
      ['连续失败 / 卡住', '—', '✓', '✓'],
      ['上下文将满', '—', '✓', '✓'],
      ['周报 · 建议效果 · 新来源', '✓', '—', '—']
    ].map(m => ({ e: m[0], a: m[1], b: m[2], c: m[3] }));
    const spec = [
      { n: 1, t: '时效性通知', d: '只有「等你确认」属于时效性；用户授权后才可突破专注模式，否则进入通知中心。' },
      { n: 2, t: '结果通知', d: '标题说结果，正文给数字和下一步；不用感叹号，不用情绪化措辞。' },
      { n: 3, t: '周报', d: '每周一 09:00（可改），点按打开 A1 并带上「上周」筛选，同时生成可分享的报告。' },
      { n: 4, t: '投递矩阵', d: '同一事件只在最合适的地方出现一次；矩阵可在设置 › 通知中逐项修改。' },
      { n: 5, t: '合并', d: '同一会话 10 分钟内的多条事件合并；连续完成多个会话时汇总为「3 个会话已完成」。' },
      { n: 6, t: '可撤销动作', d: '通知按钮只做跳转或可撤销操作；「撤销…」带省略号，表示还会再确认一次。' },
      { n: 7, t: '静默时段', d: '跟随系统专注模式；也可单独为 Orbit 设置夜间静默。' }
    ];
    return { theme: dark ? 'dk' : '', items: items, matrix: matrix, spec: spec };
  }
