<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false,"section":"外观"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const code = [{ L: 'D', n: '委托', v: 72 }, { L: 'I', n: '即兴', v: 64 }, { L: 'M', n: '多线', v: 81 }, { L: 'V', n: '求证', v: 68 }];
    let sd = 7;
    const rr = () => { sd |= 0; sd = (sd + 0x6D2B79F5) | 0; let t = Math.imul(sd ^ (sd >>> 15), 1 | sd); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const C = 200;
    const pt = (r, a) => [C + r * Math.sin(a), C - r * Math.cos(a)];
    const f1 = (n) => n.toFixed(1);
    const hw = [0.42, 0.22, 0.08, 0.03, 0.01, 0.01, 0.03, 0.1, 0.3, 0.55, 0.85, 0.95, 0.6, 0.55, 0.8, 0.92, 0.88, 0.75, 0.5, 0.55, 0.8, 0.95, 0.92, 0.7];
    const hsum = hw.reduce((a, b) => a + b, 0);
    const pickHour = () => { let x = rr() * hsum; for (let h = 0; h < 24; h++) { x -= hw[h]; if (x <= 0) return h; } return 23; };
    const dots = [112, 38, 14, 13, 9].map(n => {
      let d = '';
      for (let i = 0; i < n; i++) {
        const t = pickHour() + rr();
        const dur = 6 + Math.pow(rr(), 1.7) * 120;
        const p = pt(140 + Math.min(dur, 126) / 126 * 40, t / 24 * Math.PI * 2);
        const dr = 2.3 + rr() * 1.5;
        d += 'M' + f1(p[0] - dr) + ' ' + f1(p[1]) + 'a' + f1(dr) + ' ' + f1(dr) + ' 0 1 0 ' + f1(2 * dr) + ' 0a' + f1(dr) + ' ' + f1(dr) + ' 0 1 0 ' + f1(-2 * dr) + ' 0';
      }
      return d;
    });
    let hours = '';
    for (let k = 0; k < 48; k++) {
      const h = Math.floor(k / 2);
      const v = k % 2 === 0 ? hw[h] : (hw[h] + hw[(h + 1) % 24]) / 2;
      const a = (k + 0.5) / 48 * Math.PI * 2;
      const p1 = pt(100, a), p2 = pt(104 + v * 24, a);
      hours += 'M' + f1(p1[0]) + ' ' + f1(p1[1]) + 'L' + f1(p2[0]) + ' ' + f1(p2[1]);
    }
    const petal = (deg, L) => {
      const a = deg * Math.PI / 180, w = 0.42;
      const tip = pt(L, a), c1 = pt(L * 0.62, a + w), c2 = pt(L * 0.62, a - w);
      return 'M200 200Q' + f1(c1[0]) + ' ' + f1(c1[1]) + ' ' + f1(tip[0]) + ' ' + f1(tip[1]) + 'Q' + f1(c2[0]) + ' ' + f1(c2[1]) + ' 200 200Z';
    };
    let major = '', minor = '';
    [[0, 72, 1], [180, 28, 0], [90, 64, 1], [270, 36, 0], [45, 81, 1], [225, 19, 0], [315, 68, 1], [135, 32, 0]].forEach(p => {
      const s = petal(p[0], 16 + p[1] * 0.56);
      if (p[2]) major += s; else minor += s;
    });
    const fp = { d0: dots[0], d1: dots[1], d2: dots[2], d3: dots[3], d4: dots[4], hours: hours, major: major, minor: minor };
    const stats = [{ v: '186', k: '个会话' }, { v: '5', k: '个 Agent 同时在用' }, { v: '142', k: '小时人机协作' }];
    const traits = [{ t: '高吞吐' }, { t: '多线程' }, { t: '验收严格' }, { t: '中英混用' }];
    return { theme: light ? 'lt' : '', code: code, fp: fp, stats: stats, traits: traits };
  }
}
