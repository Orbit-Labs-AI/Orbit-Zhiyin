<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Orbit 侧边栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&amp;family=Noto+Serif+SC:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="主导航" style="width: 236px; height: 884px; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 8px 8px; background: var(--sb, #ecebe5); border: 1px solid var(--line, #e3e1dc); border-radius: 12px; font-family: var(--sans, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', sans-serif); color: var(--ink-1, #17181b); font-size: 13px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased;">
  <div style="height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 2px 0 8px;">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.2);"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.2);"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.2);"></span>
    <span style="flex: 1;"></span>
    <button type="button" aria-label="收起侧边栏" style="width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-3, #62666f); display: grid; place-items: center; padding: 0; cursor: default;">
      <svg width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ ic.sidebar }}"></path></svg>
    </button>
  </div>

  <label style="height: 30px; flex: none; margin: 0 2px 12px; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 9px; border-radius: 8px; background: var(--field, rgba(23,24,27,0.055)); color: var(--ink-3, #62666f);">
    <svg width="14" height="14" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ ic.search }}"></path></svg>
    <input type="search" aria-label="搜索会话、项目与建议" placeholder="搜索会话、项目、建议" style="flex: 1; min-width: 0; height: 28px; border: 0; background: transparent; outline: none; padding: 0; font: 13px/1 var(--sans, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif); color: var(--ink-1, #17181b);">
    <span style="flex: none; font: 600 10px/1 var(--mono, ui-monospace, Menlo, monospace); color: var(--ink-3, #62666f); border: 1px solid var(--line, #e3e1dc); border-radius: 4px; padding: 3px 4px;">⌘K</span>
  </label>

  <div style="font-size: 11px; font-weight: 600; color: var(--ink-3, #62666f); padding: 0 10px 4px;">洞察</div>
  <div style="display: flex; flex-direction: column; gap: 1px; flex: none;">
    <sc-for list="{{ insights }}" as="it" hint-placeholder-count="6">
      <button type="button" aria-current="{{ it.cur }}" style="height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 10px; border: 0; border-radius: 7px; background: {{ it.bg }}; box-shadow: {{ it.shadow }}; color: {{ it.fg }}; font: {{ it.fw }} 13px/1 var(--sans, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif); text-align: left; cursor: default;">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: {{ it.ic }}; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ it.icon }}"></path></svg>
        <span style="flex: 1; min-width: 0;">{{ it.label }}</span>
        <span style="font: 500 11px/1 var(--mono, ui-monospace, Menlo, monospace); color: var(--ink-3, #62666f);">{{ it.count }}</span>
      </button>
    </sc-for>
  </div>

  <div style="font-size: 11px; font-weight: 600; color: var(--ink-3, #62666f); padding: 14px 10px 4px;">行动</div>
  <div style="display: flex; flex-direction: column; gap: 1px; flex: none;">
    <sc-for list="{{ actions }}" as="it" hint-placeholder-count="3">
      <button type="button" aria-current="{{ it.cur }}" style="height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 10px; border: 0; border-radius: 7px; background: {{ it.bg }}; box-shadow: {{ it.shadow }}; color: {{ it.fg }}; font: {{ it.fw }} 13px/1 var(--sans, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif); text-align: left; cursor: default;">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: {{ it.ic }}; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ it.icon }}"></path></svg>
        <span style="flex: 1; min-width: 0;">{{ it.label }}</span>
        <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}">
          <span style="height: 18px; min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--ink-1, #17181b); color: var(--bg, #f5f4f0); font: 600 10.5px/18px var(--mono, ui-monospace, Menlo, monospace); text-align: center;">{{ it.badge }}</span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="font-size: 11px; font-weight: 600; color: var(--ink-3, #62666f); padding: 14px 10px 4px; display: flex; justify-content: space-between;"><span>Agents</span><span style="font-weight: 500;">会话</span></div>
  <div style="display: flex; flex-direction: column; gap: 1px; flex: none;">
    <sc-for list="{{ agents }}" as="a" hint-placeholder-count="5">
      <button type="button" style="height: 27px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 13px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2, #45484f); font: 450 13px/1 var(--sans, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif); text-align: left; cursor: default;">
        <span style="width: 9px; height: 9px; border-radius: 50%; flex: none; background: {{ a.c }};"></span>
        <span style="flex: 1; min-width: 0;">{{ a.name }}</span>
        <span style="font: 500 11px/1 var(--mono, ui-monospace, Menlo, monospace); color: var(--ink-3, #62666f);">{{ a.n }}</span>
      </button>
    </sc-for>
  </div>

  <div style="font-size: 11px; font-weight: 600; color: var(--ink-3, #62666f); padding: 14px 10px 4px;">置顶项目</div>
  <div style="display: flex; flex-direction: column; gap: 1px; flex: none;">
    <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
      <button type="button" style="height: 27px; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2, #45484f); font: 450 13px/1 var(--sans, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif); text-align: left; cursor: default;">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: var(--ink-3, #62666f); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ ic.folder }}"></path></svg>
        <span style="flex: 1; min-width: 0;">{{ p.name }}</span>
        <span style="font: 500 11px/1 var(--mono, ui-monospace, Menlo, monospace); color: var(--ink-3, #62666f);">{{ p.n }}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; flex: none;">
    <div style="border-radius: 10px; background: var(--surface, #ffffff); border: 1px solid var(--line, #e3e1dc); padding: 10px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 8px; align-items: flex-start;">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; margin-top: 1px; fill: none; stroke: var(--good, #11843a); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ ic.shield }}"></path></svg>
        <div style="min-width: 0;">
          <div style="font-size: 12.5px; font-weight: 600; line-height: 16px;">仅本地处理</div>
          <div style="font-size: 11px; line-height: 15px; color: var(--ink-3, #62666f);">0 B 上传 · 脱敏规则 6 条生效</div>
        </div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: var(--ink-3, #62666f); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ ic.sync }}"></path></svg>
        <div style="font-size: 11px; line-height: 15px; color: var(--ink-3, #62666f);">已索引 2,416 个会话 · 2 分钟前</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; padding: 0 2px 0 4px;">
      <span style="width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--ink-1, #17181b); color: var(--bg, #f5f4f0); font: 600 11px/1 var(--mono, ui-monospace, Menlo, monospace);">yh</span>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 12.5px; font-weight: 600; line-height: 16px;">yhyfhgs</div>
        <div style="font: 500 10.5px/14px var(--mono, ui-monospace, Menlo, monospace); color: var(--ink-3, #62666f);">DIMV · 指挥家</div>
      </div>
      <button type="button" aria-label="偏好设置" style="width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-3, #62666f); display: grid; place-items: center; padding: 0; cursor: default;">
        <svg width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;"><path d="{{ ic.settings }}"></path></svg>
      </button>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","persona","sessions","tools","projects","sentiment","recs","library","studio"],"default":"overview","section":"导航"},"$preview":{"width":236,"height":884}}'>

      settings: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4'
    };
    const icons = {
      overview: 'M4 4h6v8H4zM14 4h6v5h-6zM14 13h6v7h-6zM4 16h6v4H4z',
      persona: 'M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 15c1.5 1.3 4.5 1.3 6 0M9 10h.01M15 10h.01',

    const mk = (key, label, count, badge) => {
      const on = key === active;
      return {

      projects: [

}
</script>
</body>
