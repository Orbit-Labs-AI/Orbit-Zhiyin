[project]
name = "orbit-workspace"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["orbit-backend"]

[project.optional-dependencies]
embeddings = ["orbit-catalog[embeddings]==0.1.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/backend", "packages/data", "packages/catalog"]

[tool.uv.sources]
orbit-backend = { workspace = true }
orbit-data = { workspace = true }
orbit-catalog = { workspace = true }

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-xdist==3.8.0", "httpx==0.28.1", "ruff==0.12.2"]

[tool.pytest.ini_options]
markers = ["serial: wall-clock or fixed-port tests; scripts/check.sh runs them after the parallel pass"]
testpaths = ["packages/backend/tests", "packages/data/tests", "packages/catalog/tests", "tests/integration", "tests/e2e", "tests/regression"]

[tool.ruff]
src = ["packages/backend/src", "packages/catalog/src"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
