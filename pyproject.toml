[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-backend"
version = "0.13.6"
description = "Local Codex trajectory analysis with evidence-backed Chinese explanations"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.7", "uvicorn==0.34.3", "markdown-it-py==4.2.0", "scikit-learn==1.7.2", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.2"]
embeddings = ["onnxruntime==1.30.0", "tokenizers==0.23.2"]

[project.scripts]
tandem = "tandem_backend.cli:main"
tandem-catalog = "tandem_catalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tandem_backend = ["data/*.json"]
tandem_catalog = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
