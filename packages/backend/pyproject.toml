[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-backend"
version = "0.13.6"
description = "Local multi-agent L0-L3 data pipeline and evidence-backed analysis"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "orbit-data==0.2.0",
    "orbit-catalog==0.1.0",
    "fastapi==0.115.12",
    "pydantic==2.11.7",
    "uvicorn==0.34.3",
    "markdown-it-py==4.2.0",
    "scikit-learn==1.7.2",
    "scipy>=1.16,<2",
    "jieba==0.42.1",
]

[project.optional-dependencies]
embeddings = ["orbit-catalog[embeddings]==0.1.0"]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.2"]

[project.scripts]
orbit = "orbit_backend.cli:main"
orbit-helper = "orbit_backend.services.__main__:main"

[tool.uv.sources]
orbit-data = { workspace = true }
orbit-catalog = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit_backend = ["data/*.json", "data/recommend/*.json", "appdb/schema/*.sql", "install/assets/*.py", "ai/assets/templates/*.json", "ai/assets/templates/*/*"]
