[project]
name = "orbit-data"
version = "0.2.0"
description = "Local session ingestion and versioned L1-L3 data contracts for Orbit"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.23,<5", "zstandard>=0.23,<1", "PyYAML>=6,<7", "json5>=0.12,<1"]

[project.scripts]
orbit-data = "orbit_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_data"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # Formatter governs layout; SQL strings preserve query readability.

[tool.pytest.ini_options]
testpaths = ["tests"]
