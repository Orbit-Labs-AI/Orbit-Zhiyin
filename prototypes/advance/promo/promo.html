<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Promo</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="glow" id="glow"></div>
  <!-- two live copies of the app take turns, so an outgoing and an incoming component can overlap in a transition -->
  <div class="cam" id="cam0"><div class="rig" id="rig0"><iframe id="app0" src="../tandem-demo.html#overview" title="Tandem A" scrolling="no"></iframe></div></div>
  <div class="cam" id="cam1"><div class="rig" id="rig1"><iframe id="app1" src="../tandem-demo.html#overview" title="Tandem B" scrolling="no"></iframe></div></div>
  <div class="cam" id="cam2"><div class="rig" id="rig2"></div></div>
  <svg class="orbit" id="orbit" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <div class="fx" id="fx"></div>
</div>
<button type="button" class="play" id="play">▶ 播放（含配乐）</button>
<script src="promo.js"></script>
</body>
</html>
