<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tandem 交互 Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap">
<style>
/*@css*/
</style>
</head>
<body>
<div class="desk" id="desk">
  <svg class="wall" aria-hidden="true" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900"><circle cx="1180" cy="1040" r="430" fill="none" stroke="var(--desk-2)" stroke-width="70"/><circle cx="1180" cy="1040" r="620" fill="none" stroke="var(--desk-2)" stroke-width="34" opacity=".6"/><circle cx="1180" cy="1040" r="790" fill="none" stroke="var(--desk-2)" stroke-width="14" opacity=".45"/></svg>
  <header class="mbar" id="mbar" aria-label="菜单栏"></header>
  <aside class="widgets" id="widgets" aria-label="桌面小组件" hidden></aside>
  <section class="panel win" id="win" aria-label="Tandem 主窗口" data-mode="win">
    <div class="wtop" id="wtop"></div>
    <nav class="side" id="side" aria-label="主导航"></nav>
    <div class="main" id="main"></div>
    <div class="sidescrim" id="sidescrim" data-act="sideScrim"></div>
  </section>
  <section class="panel set" id="set" aria-label="设置" hidden></section>
  <div class="hud" id="hud"></div>
  <div class="pop" id="pop" role="dialog" aria-label="Tandem 菜单栏面板" hidden></div>
  <div class="dd" id="dd" role="menu" hidden></div>
  <div class="notes" id="notes" aria-live="polite"></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
</div>
<script>
/*@js*/
</script>
</body>
</html>
