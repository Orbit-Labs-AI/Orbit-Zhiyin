mark.st-leak{background:var(--crit-bg);color:var(--crit);border-radius:3px;padding:0 2px;font-weight:600}
/* Between 800 and 999px of content width the shell stacks .studio into one column; two columns (task + run) with the artifact
   below keep the page half as tall. .content .studio outranks the shell's single-class rule in 90-responsive.css. */
@container main (max-width:999px){.content .studio{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.content .studio>.card:last-child{grid-column:1/-1}}
@container main (max-width:799px){.content .studio{grid-template-columns:minmax(0,1fr)}.content .studio>.card:last-child{grid-column:auto}}

/* menu bar panel (right edge aligned to the status item by js), menus / dropdowns, floating HUD, desktop widgets
   (desktop layer, z below the window), notifications (344px, slide in from the right). */
.pop{position:absolute;z-index:60;top:30px;right:120px;width:336px;max-height:calc(100% - 46px);overflow:auto;border-radius:12px;background:var(--raised);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);box-shadow:var(--sh-pop);color:var(--ink-1);animation:popin .12s var(--ease);transform-origin:top right}
.pop .sec{padding:12px 14px;border-top:1px solid var(--hair)}
.dd{position:absolute;z-index:70;min-width:200px;max-width:min(340px,calc(100% - 16px));border-radius:10px;background:var(--raised);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);box-shadow:var(--sh-pop);padding:5px;max-height:calc(100% - 40px);overflow:auto}
.dd button{width:100%;display:flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 6px;border:0;border-radius:5px;background:transparent;text-align:left;font-size:13px;color:var(--ink-1);white-space:nowrap}
.dd button:hover,.dd button.act{background:var(--accent);color:var(--accent-ink)}
.dd button:hover .k,.dd button.act .k{color:inherit;opacity:.8}
.dd button[disabled]{color:var(--ink-4);pointer-events:none}
.dd .ck{width:14px;flex:none;font-size:11px;text-align:center}
.dd .k{margin-left:auto;font-size:13px;color:var(--ink-3);padding-left:20px;font-variant-numeric:tabular-nums}
.dd .sub{margin-left:auto;font-size:11px;color:var(--ink-3)}
.dd hr{border:0;border-top:1px solid var(--sep);margin:5px 0}
.dd .h{font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 10px 3px}
.hud{position:absolute;z-index:40;color:var(--hud-ink);user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:flex-start}
.pill{height:44px;border-radius:22px;background:var(--hud);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.12);font-size:13px;white-space:nowrap;max-width:min(320px,calc(100vw - 32px));cursor:grab}
.pill>*{min-width:0}
.pill:active{cursor:grabbing}
.hb{height:26px;padding:0 11px;border-radius:13px;border:0;background:#f2f2f4;color:#1c1c1e;font-size:12px;font-weight:600;flex:none}
.hg{height:26px;padding:0 10px;border-radius:7px;border:0;background:var(--hud-2);color:var(--hud-ink);font-size:12px;display:inline-flex;align-items:center;gap:6px;flex:none}
.hcard{margin:8px 0;width:min(380px,calc(100vw - 32px));border-radius:18px;background:var(--hud);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.12);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;animation:popin .12s var(--ease)}
.hud .lane{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;font-size:11px;color:var(--hud-ink-3)}
.snap{position:absolute;z-index:39;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--ink-1);background:var(--accent-tint);box-shadow:0 0 0 1.5px var(--bg);pointer-events:none}
.snap.near{background:var(--ink-1)}
.widgets{position:absolute;z-index:5;left:24px;top:42px;width:364px;display:flex;flex-direction:column;gap:20px}
.wg{border-radius:20px;background:var(--wg);color:var(--ink-1);box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 .5px var(--wg-edge);padding:14px 16px;overflow:hidden;text-align:left;border:0;width:100%}
.wg .lbl{font:600 10px/13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.wg-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.desk.fs .widgets{display:none}
.notes{position:absolute;z-index:80;top:32px;right:16px;width:min(344px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.nt{position:relative;pointer-events:auto;border-radius:14px;background:var(--raised);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);box-shadow:var(--sh-pop);padding:10px 12px 10px 12px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;animation:slidein .3s var(--ease)}
.nt .nt-t{display:flex;gap:8px;align-items:baseline}
.nt .nt-t b{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt .nt-b{font-size:12px;line-height:16px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt .nt-a{display:flex;gap:6px;margin-top:6px;height:0;opacity:0;overflow:hidden;transition:opacity .15s,height .15s}
.nt:hover .nt-a,.nt:focus-within .nt-a{height:20px;opacity:1}
.nt .nt-x{position:absolute;left:-6px;top:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--raised);color:var(--ink-2);box-shadow:var(--sh-raise);display:grid;place-items:center;opacity:0;transition:opacity .12s}
.nt:hover .nt-x,.nt .nt-x:focus-visible{opacity:1}
.nt.out{animation:slideout .25s var(--ease) forwards;pointer-events:none}
@keyframes slideout{to{opacity:0;transform:translateX(24px)}}
.appicon{width:32px;height:32px;border-radius:8px;background:#1c1c1e;display:grid;place-items:center;flex:none}

/* live surfaces: menu-bar panel charts, HUD density band, desktop widget sizes, settings matrix / AI channel.
   The context bar (.ctxbar) is the one small chart shared by the panel, the HUD (.dk) and the large widget (S-V03). */
.ctxbar{display:flex;flex-direction:column;gap:3px;min-width:0}
.ctxbar-h{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ctxbar-h b{color:var(--ink-1)}
.ctxbar-t{position:relative;height:6px;border-radius:3px;background:var(--line)}
.ctxbar-f{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink-1);transition:width .4s var(--ease)}
.ctxbar-f.warn{background:var(--warn-m)}
.ctxbar-th{position:absolute;top:-3px;width:1.5px;height:12px;background:var(--ink-3)}
.ctxbar.dk{border-radius:9px;background:var(--hud-2);padding:6px 8px;grid-column:span 2}
.ctxbar.dk .ctxbar-h{color:var(--hud-ink-3)}
.ctxbar.dk .ctxbar-h b{color:var(--hud-ink);font-size:15px;font-weight:600}
.ctxbar.dk .ctxbar-t{background:var(--hud-line)}
.ctxbar.dk .ctxbar-f{background:var(--hud-ink)}
.ctxbar.dk .ctxbar-f.warn{background:#f3b843}
.ctxbar.dk .ctxbar-th{background:var(--hud-ink-3)}
/* panel · last 7 days: one column per day, count on top, weekday under; today in ink (orange stays Claude's) */
.pwk{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:6px}
.pwk-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0}
.pwk-c b{font-size:10px;font-weight:500;color:var(--ink-3);line-height:1}
.pwk-c i{display:block;width:100%;border-radius:2px 2px 1px 1px;background:var(--h2)}
.pwk-c.today i{background:var(--ink-1)}
.pwk-c.today b,.pwk-c.today>span{color:var(--ink-1);font-weight:600}
.pwk-c>span{font-size:10px;line-height:1}
.pm-base{white-space:nowrap}
/* HUD · 20-minute density band and the metric grid (context bar spans the first row) */
.hband{display:flex;flex-direction:column;gap:4px;min-width:0}
.hband svg{display:block}
.hk{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--hud-ink-2)}
.hk.you{border-radius:50%;background:var(--hud-ink)}
.hk.err{background:var(--vz-err)}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hcell{border-radius:9px;background:var(--hud-2);padding:6px 8px;min-width:0}
.hgrid .ctxbar.dk{grid-column:1 / -1}
/* desktop widgets · three sizes in one 364px column */
.wg-menu{position:absolute;right:10px;top:8px;z-index:1}
.wg-menu .ib{opacity:.45;transition:opacity .15s}
.widgets:hover .wg-menu .ib,.wg-menu .ib:focus-visible{opacity:1}
.wg.sq{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.wg.wk{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:12px;align-items:end}
.wg-week{display:flex;align-items:flex-end;gap:5px;height:84px}
.wg-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0}
.wg-col b{font-size:10px;font-weight:500;line-height:1;color:var(--ink-3);height:10px}
.wg-stack{display:flex;flex-direction:column;justify-content:flex-end;gap:1px;width:100%}
.wg-stack i{display:block;width:100%}
.wg-stack i:first-child{border-radius:2px 2px 0 0}
.wg-col>span.cap{font-size:9px;line-height:1}
.wg-trend{display:flex;flex-direction:column;gap:4px;min-width:0}
.wg-trend .vz-spark{display:block;max-width:100%}
/* settings · notification matrix (every column is its own channel) and the AI channel list */
.nmx th{text-align:center;vertical-align:bottom}
.nmx th:first-child{text-align:left}
.nmx td{text-align:center}
.nmx td:first-child{text-align:left}
.nmx input[type=checkbox]{width:15px;height:15px;accent-color:var(--ink-1);vertical-align:middle}
.nmx-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11px;color:var(--ink-3)}
.nmx-legend b{color:var(--ink-2);font-weight:600}
.aich{display:flex;flex-direction:column}
.aich-r{padding:7px 0;border-bottom:1px solid var(--hair);gap:10px}
.aich-r:last-child{border-bottom:0}
.aich.off .aich-r{opacity:.55}
.sw[disabled]{opacity:.45;pointer-events:none}

/* settings panel (its own window chrome, never shares .win rules), sheets (#modal + #scrim sized to the key window by js),
   command palette (floating, no scrim), toast (status / undo bar inside the window), tooltip, onboarding / reveal overlay. */
.set{z-index:30;width:min(720px,calc(100% - 32px));height:min(560px,calc(100% - 56px));display:flex;flex-direction:column;container:set/inline-size}
.set.inactive .ptitle{color:var(--ink-3)}
.ptop{flex:none;height:52px;display:flex;align-items:center;padding-left:19px;position:relative}
.ptop .ptitle{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;pointer-events:none}
.set .tabs{flex:none;display:flex;justify-content:center;gap:2px;padding:0 8px 6px;flex-wrap:wrap;box-shadow:0 .5px 0 var(--hair)}
.set .tabs button{width:68px;height:52px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}
.set .tabs button:hover{background:var(--field)}
.set .tabs button.on{background:var(--sel);color:var(--ink-1)}
.set .tabs button .ico{color:var(--ink-3)}
.set .tabs button.on .ico{color:var(--ink-1)}

/* Responsive = container queries. "win" is the main window (.win), "main" the content column (.main, i.e. window minus
   sidebar). Page grids break on the content width, never on the viewport. The thresholds follow the published demo: the
   default window on a 14" display (content column 836px) keeps every side-by-side layout, the 820px "fit" stage (788px)
   stacks them like the published full-screen layout did, and a Studio Display fills the window instead of centring a
   narrow column:
     main ≥ 1900  → content capped at 1800px and centred (5K / 6K displays only)
     main < 1000  → .studio stacks (three columns need ≥ 1000)
     main <  900  → toolbar search becomes an icon
     main <  800  → metric tiles 3 + 2; .two .proj .recs .sess .persona-hero stack; .three / .lib-feat auto-fit; .ov-ai 2×2
     main <  640  → metric tiles 2 per row, .stats7 4 + 3, persona axes tighten
   Media queries stay only for accessibility settings (reduced motion / transparency, more contrast) and tiny stages. */
@container main (min-width:1900px){.content>*{max-width:1800px;margin-inline:auto}}
@container main (max-width:999px){.studio{grid-template-columns:minmax(0,1fr)}}
@container main (max-width:899px){.tsearch{width:28px;padding:0;justify-content:center}.tsearch span,.tsearch kbd{display:none}}
@container main (max-width:799px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.two,.proj,.recs{grid-template-columns:minmax(0,1fr)!important}.sess,.persona-hero{grid-template-columns:minmax(0,1fr)}.slist{max-height:320px}.three,.lib-feat{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))!important}.ov-ai{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container main (max-width:639px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.stats7{grid-template-columns:repeat(4,minmax(0,1fr))}.ov-ai{grid-template-columns:minmax(0,1fr)}.letters .L{font-size:72px}.ax{grid-template-columns:58px minmax(0,1fr) 58px 26px;gap:6px;font-size:12px}.persona-hero{padding:16px}.content{padding:0 16px 24px}}
@media (max-width:600px){.mbar .sysicon,.mbar .status .glyph[data-m="demo"]{display:none}.widgets{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* reduce transparency: every glass surface becomes solid (menu bar, sidebar, menus, panel, notifications, HUD, palette, toast) */
@media (prefers-reduced-transparency:reduce){
:root{--menubar:#ececf0;--sb:#e9e9ed;--raised:#fbfbfc;--hud:#1f1f22;--field:rgba(0,0,0,.07)}
:root[data-theme="dark"]{--menubar:#232327;--sb:#29292e;--raised:#36363c;--hud:#2e2e33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--menubar:#232327;--sb:#29292e;--raised:#36363c;--hud:#2e2e33}}
.mbar,.side,.pop,.dd,.nt,.tmore-pop,.modal.pal,.toast-in,.pill,.hcard{-webkit-backdrop-filter:none;backdrop-filter:none}
}
/* increase contrast: stronger separators and secondary text */
@media (prefers-contrast:more){
:root{--line:rgba(0,0,0,.22);--hair:rgba(0,0,0,.14);--sep:rgba(0,0,0,.28);--ink-3:#48484c;--ink-4:#8a8a8f}
:root[data-theme="dark"]{--line:rgba(255,255,255,.24);--hair:rgba(255,255,255,.14);--sep:rgba(255,255,255,.28);--ink-3:#c9c9ce;--ink-4:#8a8a90}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--line:rgba(255,255,255,.24);--hair:rgba(255,255,255,.14);--sep:rgba(255,255,255,.28);--ink-3:#c9c9ce;--ink-4:#8a8a90}}
}

const APP_MARK = '<svg width="20" height="15" viewBox="0 0 24 18" aria-hidden="true" fill="none" stroke="#f2f2f4" stroke-width="1.8"><circle cx="8.5" cy="9" r="6"/><circle cx="15.5" cy="9" r="6"/></svg>';
function setTheme(t) {
  S.theme = t; store.set('theme', t);
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
/* tooltip: light, 11px, shows after a 0.8s hover delay (tipOn() itself is immediate) */
let TIPS = {}, TIP_T = null;
function tipOn(el, ev) {
  let html = null;
  if (el.dataset.tip) html = esc(el.dataset.tip);
  else if (el.dataset.tf) { const [k, ...args] = el.dataset.tf.split('|'); if (TIPS[k]) html = TIPS[k](...args); }
  if (!html) return;
  const t = $('#tip'); t.innerHTML = html; t.hidden = false; tipMove(ev);
}
function tipMove(ev) {
  const t = $('#tip'); if (t.hidden) return;
  const w = t.offsetWidth, h = t.offsetHeight;
  let x = ev.clientX + 12, y = ev.clientY + 18;
  if (x + w > window.innerWidth - 8) x = ev.clientX - w - 12;
  if (y + h > window.innerHeight - 8) y = ev.clientY - h - 12;
  t.style.left = Math.max(8, x) + 'px'; t.style.top = Math.max(8, y) + 'px';
}
function tipOff() { clearTimeout(TIP_T); $('#tip').hidden = true; }
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest('[data-tip],[data-tf]'); clearTimeout(TIP_T);
  if (el) { const ev = { clientX: e.clientX, clientY: e.clientY }; TIP_T = setTimeout(() => tipOn(el, ev), 800); } else tipOff();
});
document.addEventListener('mousemove', tipMove);
document.addEventListener('mousedown', () => tipOff(), true);
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip],[data-tf]'); if (el && el.matches(':focus-visible')) { const r = el.getBoundingClientRect(); tipOn(el, { clientX: r.left + r.width / 2, clientY: r.bottom }); } });
document.addEventListener('focusout', tipOff);

/* toast(msg, {act, sec, onAct}) — a status / undo bar inside the main window (top of the content column) */
let toastTimer = null;
function toast(msg, opt) {
  opt = opt || {};
  const t = $('#toast'); clearInterval(toastTimer);
  let left = opt.sec || 0;
  const draw = () => { t.innerHTML = '<div class="toast-in"><span>' + esc(msg) + '</span>' + (opt.act ? '<button type="button" data-act="toastAct">' + esc(opt.act) + (left ? ' · ' + left : '') + '</button>' : '') + '</div>'; };
  t.onAct = opt.onAct || null; draw(); t.hidden = false; toastPlace();
  let life = opt.sec ? opt.sec : 4;
  toastTimer = setInterval(() => { life--; if (opt.sec) { left = life; draw(); } if (life <= 0) { clearInterval(toastTimer); t.hidden = true; } }, 1000);
}
function toastPlace() {
  const t = $('#toast'); if (t.hidden) return;
  const d = desk.getBoundingClientRect(); const m = $('#main');
  if (m && !S.winGone) { const r = m.getBoundingClientRect(); t.style.left = Math.round(r.left - d.left) + 'px'; t.style.width = Math.round(r.width) + 'px'; t.style.top = Math.round(r.top - d.top + 60) + 'px'; t.style.bottom = 'auto'; }
  else { t.style.left = '0px'; t.style.width = Math.round(d.width) + 'px'; t.style.top = 'auto'; t.style.bottom = '28px'; }
}

/* sheets: openModal(html, cls) attaches #modal under the title bar of the key window (main window or settings), the scrim only
   covers that window; cls "pal" is the floating command palette (no scrim). Focus lands on the default button, Return
   triggers it (85-keyboard.js), Esc closes; the previously focused element gets focus back on close. */
let MODAL_KEY = null, MODAL_PREV = null, MODAL_HOST = null;
function sheetHost() { const set = $('#set'); return (!set.hidden && S.keyWin === 'set') ? set : $('#win'); }
function openModal(html, cls) {
  const m = $('#modal'); const pal = /\bpal\b/.test(cls || '');
  if (m.hidden) MODAL_PREV = document.activeElement;
  MODAL_HOST = pal ? null : sheetHost();
  if (MODAL_HOST === $('#win') && S.winGone) { S.winGone = false; render(); }
  m.className = 'modal' + (cls ? ' ' + cls : ''); m.innerHTML = html; m.hidden = false;
  if (!pal && !m.querySelector('[data-act="closeModal"]')) { const mh = m.querySelector('.mh'); if (mh) mh.insertAdjacentHTML('beforeend', '<button type="button" class="ib mx" data-act="closeModal" aria-label="关闭">' + ic('x', 14) + '</button>'); }
  $('#scrim').hidden = pal; closeDD(); tipOff(); sheetPlace();
  const f = m.querySelector('[autofocus]') || m.querySelector('.mf .btn.p:not([disabled])') || m.querySelector('input:not([type="checkbox"]):not([type="radio"]),textarea') || m.querySelector('button.p:not([disabled])') || m.querySelector('button:not([disabled]):not(.mx)');
  if (f) setTimeout(() => { if (!m.hidden && m.contains(f)) f.focus({ preventScroll: true }); }, 20);
}
function closeModal() {
  const m = $('#modal'); const was = !m.hidden;
  m.hidden = true; $('#scrim').hidden = true; m.innerHTML = ''; m.className = 'modal'; MODAL_KEY = null; MODAL_HOST = null;
  const p = MODAL_PREV; MODAL_PREV = null;
  if (was && p && p.isConnected && typeof p.focus === 'function' && !p.closest('#modal')) { try { p.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
function sheetPlace() {
  const m = $('#modal'), sc = $('#scrim'); if (m.hidden) return;
  const d = desk.getBoundingClientRect();
  if (!MODAL_HOST) { m.style.left = Math.max(8, Math.round((d.width - m.offsetWidth) / 2)) + 'px'; m.style.top = Math.round(Math.max(40, d.height * 0.14)) + 'px'; m.style.maxHeight = Math.round(d.height * 0.72) + 'px'; return; }
  const r = MODAL_HOST.getBoundingClientRect();
  const hx = Math.round(r.left - d.left), hy = Math.round(r.top - d.top), hw = Math.round(r.width), hh = Math.round(r.height);
  sc.style.left = hx + 'px'; sc.style.top = hy + 'px'; sc.style.width = hw + 'px'; sc.style.height = hh + 'px'; sc.style.borderRadius = getComputedStyle(MODAL_HOST).borderRadius;
  m.style.setProperty('--sheet-max-w', Math.max(260, hw - 80) + 'px');
  m.style.maxHeight = Math.max(160, hh - 52 - 24) + 'px';
  m.style.left = Math.round(hx + (hw - m.offsetWidth) / 2) + 'px'; m.style.top = (hy + 52) + 'px';
}
function modalHead(title, sub) { return '<div class="mh"><div style="flex:1;min-width:0"><h2>' + title + '</h2>' + (sub ? '<div class="cap" style="margin-top:3px">' + sub + '</div>' : '') + '</div></div>'; }

/* dropdown menus: openDD(anchor, items, onPick, {keep, refresh, align}) — menu-bar menus hang from the bar, others open under
   the anchor and flip left / up when they would leave the stage */
let DD = null;
function openDD(anchor, items, onPick, opt) {
  opt = opt || {};
  const dd = $('#dd');
  const draw = (its) => { dd.innerHTML = its.map((it, i) => it.sep ? '<hr>' : it.h ? '<div class="h">' + esc(it.h) + '</div>' : '<button type="button" role="menuitem" data-i="' + i + '"' + (it.dis ? ' disabled' : '') + '><span class="ck">' + (it.on ? '✓' : '') + '</span><span>' + esc(it.t) + '</span>' + (it.k ? '<span class="k">' + esc(it.k) + '</span>' : it.sub ? '<span class="sub">▶</span>' : '') + '</button>').join(''); };
  draw(items);
  DD = { items, onPick, keep: opt.keep, refresh: opt.refresh, draw, anchor };
  dd.hidden = false;
  const r = anchor.getBoundingClientRect(), d = desk.getBoundingClientRect();
  const inBar = !!anchor.closest('.mbar');
  let left = Math.round(r.left - d.left), top = Math.round(r.bottom - d.top) + (inBar ? 1 : 4);
  const w = dd.offsetWidth, h = dd.offsetHeight;
  if (opt.align === 'right' || left + w > d.width - 8) left = Math.max(8, Math.round(r.right - d.left) - w);
  if (top + h > d.height - 8) top = Math.max(8, Math.round(r.top - d.top) - h - 4);
  dd.style.left = left + 'px'; dd.style.top = top + 'px';
  $$('.mbar button.on').forEach((b) => b.classList.remove('on'));
  if (inBar) anchor.classList.add('on');
}
function closeDD() { $('#dd').hidden = true; DD = null; $$('.mbar button.on').forEach((b) => b.classList.remove('on')); }
$('#dd').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]'); if (!b || !DD) return;
  const it = DD.items[+b.dataset.i]; const d = DD;
  if (!d.keep) closeDD();
  d.onPick(it.v, it, e);
  if (d.keep && DD === d && d.refresh) { d.items = d.refresh(); d.draw(d.items); }
});
function copyText(text, label) {
  const done = () => toast((label || '内容') + '已复制到剪贴板');
  const fail = () => { openModal(modalHead('手动复制', '浏览器拒绝了剪贴板访问，请选中下面的文字后复制') + '<div class="mb"><textarea id="copyArea" style="width:100%;min-height:200px;font:12px/1.5 var(--mono);border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)">' + esc(text) + '</textarea></div><div class="mf"><button type="button" class="btn p" data-act="closeModal">完成</button></div>'); setTimeout(() => { const a = $('#copyArea'); if (a) a.select(); }, 30); };
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
}
/* notifications: 344px banners, slide in from the right (300ms, fades in while sliding), slide back out on dismiss (250ms);
   hovering keeps a banner alive; actions and the × appear on hover */
function noteDismiss(el) {
  if (!el || !el.isConnected || el.classList.contains('out')) return;
  el.classList.add('out');
  let done = false; const rm = () => { if (!done) { done = true; el.remove(); } };
  el.addEventListener('animationend', rm, { once: true }); setTimeout(rm, 400);
  if (typeof hudPlace === 'function') hudPlace();
}
function notify(n) {
  if (S.paused && !n.force) return;
  const box = $('#notes'); const id = 'n' + Math.random().toString(36).slice(2, 8);
  const el = document.createElement('div'); el.className = 'nt'; el.id = id; el.setAttribute('role', 'status');
  el.innerHTML = '<span class="appicon">' + APP_MARK + '</span><div style="min-width:0;display:flex;flex-direction:column;gap:1px"><div class="nt-t"><b>' + esc(n.t) + '</b><span class="cap" style="font-size:11px;flex:none">' + esc(n.when || '现在') + '</span></div><div class="nt-b">' + esc(n.b) + '</div>' +
    (n.a1 || n.a2 ? '<div class="nt-a">' + (n.a1 ? '<button type="button" class="btn sm p" data-act="noteAct" data-n="' + id + '" data-k="1">' + esc(n.a1) + '</button>' : '') + (n.a2 ? '<button type="button" class="btn sm" data-act="noteAct" data-n="' + id + '" data-k="2">' + esc(n.a2) + '</button>' : '') + '</div>' : '') +
    '</div><button type="button" class="nt-x" data-act="noteClose" data-n="' + id + '" aria-label="关闭通知">' + ic('x', 11) + '</button>';
  el._n = n; box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
  if (typeof hudPlace === 'function') hudPlace();
  let hover = false; el.addEventListener('mouseenter', () => { hover = true; }); el.addEventListener('mouseleave', () => { hover = false; });
  const kill = () => { if (hover) { setTimeout(kill, 1500); return; } noteDismiss(el); };
  setTimeout(kill, n.ms || 7000);
}

/* ============ window manager ============ */
// The stage (#desk) is fixed; the main window is S.win = {x, y, w, h, zoom, full}. All four null = the published layout:
// the window fills the stage under the menu bar with 24px side / 18px top and bottom margins and, at ≥ 1500px with the
// desktop widgets shown, starts right of the widget column (24 + 364 + 24) so the widgets stay visible on the desktop layer.
// An untouched window keeps following the viewport; once the user moves or resizes it the rect is explicit and persisted
// (localStorage 'win') and only gets clamped to the stage. winRect() turns S.win into the effective rect: "win" (never below
// WIN_MIN), "zoom" (fills the area under the menu bar), "full" (fills the stage, menu bar slides away, ⌃⌘F / green light)
// or "fit" (stage smaller than WIN_MIN + margins, e.g. 820px wide: 16px margins, the inner layout adapts through
// container queries). applyWin() writes the rect, keeps the sidebar flags coherent (a window narrower than SIDE_MIN_WIN
// hides the sidebar and shows it as an overlay on demand) and fires window 'tandem:layout' whenever the content size or
// the sidebar changed — pages and vizkit re-measure on it. Drag the title row to move, 8px edges / corners to resize,
// double-click to zoom.
const MB_H = 24, WIN_MIN = { w: 900, h: 600 }, STAGE_PAD = 16, SIDE_MIN_WIN = 900;
const WIN_GAP = { x: 24, y: 18 }, WG_COL = 24 + 364 + 24, WIDE_MIN = 1500;
let WIN_LAST = null, WIN_SIG = '';
(function loadShell() {
  // a user-placed window always has all four numbers (move pins the size, resize sets the origin); anything else — including
  // rects the previous build stored on a zoom toggle with x / y null — means "follow the viewport"
  const w = store.get('win', null);
  if (w && typeof w === 'object') { const num = (k) => typeof w[k] === 'number' && isFinite(w[k]); if (['x', 'y', 'w', 'h'].every(num)) { S.win.x = w.x; S.win.y = w.y; S.win.w = w.w; S.win.h = w.h; } if (w.zoom === true) S.win.zoom = true; }
  const sd = store.get('side', null);
  if (sd && typeof sd === 'object') { if (typeof sd.show === 'boolean') S.side = sd.show; if (sd.open && typeof sd.open === 'object') Object.keys(S.sideOpen).forEach((k) => { if (typeof sd.open[k] === 'boolean') S.sideOpen[k] = sd.open[k]; }); }
  ['n', 's', 'e', 'w', 'nw', 'ne', 'sw', 'se'].forEach((d) => { const h = document.createElement('div'); h.className = 'rz'; h.dataset.rz = d; h.setAttribute('aria-hidden', 'true'); $('#win').appendChild(h); });
})();
function stageSize() { return { w: desk.clientWidth, h: desk.clientHeight }; }
function winRect() {
  const st = stageSize(), W = S.win;
  if (W.full) return { x: 0, y: 0, w: st.w, h: st.h, mode: 'full' };
  const areaH = st.h - MB_H;
  if (W.zoom) return { x: 0, y: MB_H, w: st.w, h: areaH, mode: 'zoom' };
  const maxW = st.w - STAGE_PAD * 2, maxH = areaH - STAGE_PAD * 2;
  if (maxW < WIN_MIN.w || maxH < WIN_MIN.h) return { x: STAGE_PAD, y: MB_H + STAGE_PAD, w: Math.max(240, maxW), h: Math.max(240, maxH), mode: 'fit' };
  const left = widgetsWide() ? WG_COL : WIN_GAP.x;
  const w = clamp(W.w == null ? st.w - left - WIN_GAP.x : W.w, WIN_MIN.w, maxW), h = clamp(W.h == null ? areaH - WIN_GAP.y * 2 : W.h, WIN_MIN.h, maxH);
  const x = W.x == null ? Math.min(left, st.w - w) : clamp(W.x, 0, st.w - w);
  const y = W.y == null ? Math.min(MB_H + WIN_GAP.y, st.h - h) : clamp(W.y, MB_H, st.h - h);
  return { x, y, w, h, mode: 'win' };
}
// the desktop widgets get their own column left of the window only when the stage is wide enough (≥ 1500px, as published)
function widgetsWide() { return S.widgets && stageSize().w >= WIDE_MIN; }
function applyWin() {
  const r = winRect(); const w = $('#win');
  w.style.left = r.x + 'px'; w.style.top = r.y + 'px'; w.style.width = r.w + 'px'; w.style.height = r.h + 'px';
  w.dataset.mode = r.mode;
  desk.classList.toggle('fs', r.mode === 'full'); if (r.mode !== 'full') desk.classList.remove('mbpeek');
  w.classList.toggle('zoomed', r.mode === 'zoom');
  const narrow = r.w < SIDE_MIN_WIN; if (!narrow) S.sideOver = false;
  const sideShown = narrow ? S.sideOver : S.side;
  w.classList.toggle('narrow', narrow); w.classList.toggle('nosb', !sideShown); w.classList.toggle('sbover', narrow && S.sideOver);
  w.classList.toggle('inactive', S.keyWin !== 'main');
  WIN_LAST = r;
  const sig = [r.w, r.h, r.mode, sideShown].join('|');
  if (sig !== WIN_SIG) { WIN_SIG = sig; layoutChanged(); }
  placeDeps();
}
function layoutChanged() {
  const r = WIN_LAST || winRect(); const m = $('#main');
  const detail = { win: { x: r.x, y: r.y, w: r.w, h: r.h, mode: r.mode }, side: !$('#win').classList.contains('nosb'), main: { w: m ? m.clientWidth : 0, h: m ? m.clientHeight : 0 } };
  try { window.dispatchEvent(new CustomEvent('tandem:layout', { detail })); } catch (e) { /* ignore */ }
}
function placeDeps() { toastPlace(); sheetPlace(); overlayPlace(); if (S.pop) popPlace(); hudPlace(); }
function overlayPlace() {
  const o = $('#overlay'); if (o.hidden) return;
  const d = desk.getBoundingClientRect();
  if (S.winGone || S.win.full) { o.style.left = '0px'; o.style.top = '0px'; o.style.width = d.width + 'px'; o.style.height = d.height + 'px'; o.style.borderRadius = '0'; return; }
  const r = $('#win').getBoundingClientRect();
  o.style.left = Math.round(r.left - d.left) + 'px'; o.style.top = Math.round(r.top - d.top) + 'px'; o.style.width = Math.round(r.width) + 'px'; o.style.height = Math.round(r.height) + 'px'; o.style.borderRadius = getComputedStyle($('#win')).borderRadius;
}
function saveWin() { store.set('win', { x: S.win.x, y: S.win.y, w: S.win.w, h: S.win.h, zoom: !!S.win.zoom }); }
function saveSide() { store.set('side', { show: S.side, open: S.sideOpen }); }
function winNarrow() { return (WIN_LAST || winRect()).w < SIDE_MIN_WIN; }
function toggleSide() { if (winNarrow()) S.sideOver = !S.sideOver; else { S.side = !S.side; S.sideOver = false; saveSide(); } applyWin(); renderWtop(); }
function winZoomToggle() { if (S.win.full) return; S.win.zoom = !S.win.zoom; saveWin(); applyWin(); renderWtop(); }
function winFullToggle() { S.win.full = !S.win.full; S.sideOver = false; applyWin(); renderWtop(); renderWidgets(); }
function showMain() { S.winGone = false; S.pop = false; S.keyWin = 'main'; render(); }
function keyWinApply() { $('#win').classList.toggle('inactive', S.keyWin !== 'main'); $('#set').classList.toggle('inactive', S.keyWin !== 'set'); }
document.addEventListener('pointerdown', (e) => {
  const set = e.target.closest('#set'), win = e.target.closest('#win');
  if (set && S.keyWin !== 'set') { S.keyWin = 'set'; keyWinApply(); }
  else if (win && S.keyWin !== 'main') { S.keyWin = 'main'; keyWinApply(); }
}, true);
/* move (title row) and resize (edge handles) of the main window */
let WDRAG = null;
const BAR_SKIP = 'button,input,select,textarea,a,label,[role="button"],.tsearch,.chip,.seg';
$('#win').addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const rz = e.target.closest('.rz');
  const bar = !rz && e.target.closest('.tbar,.wtop') && !e.target.closest(BAR_SKIP);
  if (!rz && !bar) return;
  const r = winRect(); if (r.mode !== 'win') return;
  // no preventDefault and no pointer capture yet: both would retarget the click / dblclick that zooms the window
  WDRAG = { kind: rz ? 'rz' : 'move', dir: rz ? rz.dataset.rz : '', sx: e.clientX, sy: e.clientY, r0: { x: r.x, y: r.y, w: r.w, h: r.h }, moved: false, id: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
  if (!WDRAG) return;
  const dx = e.clientX - WDRAG.sx, dy = e.clientY - WDRAG.sy; const st = stageSize(), r0 = WDRAG.r0;
  if (!WDRAG.moved) { if (Math.hypot(dx, dy) < 3) return; WDRAG.moved = true; try { $('#win').setPointerCapture(WDRAG.id); } catch (err) { /* ignore */ } }
  // moving also pins the current size: from here on the window is the user's and no longer follows the viewport
  if (WDRAG.kind === 'move') { S.win.x = clamp(r0.x + dx, 0, Math.max(0, st.w - r0.w)); S.win.y = clamp(r0.y + dy, MB_H, Math.max(MB_H, st.h - r0.h)); S.win.w = r0.w; S.win.h = r0.h; }
  else {
    const d = WDRAG.dir; let x = r0.x, y = r0.y, w = r0.w, h = r0.h;
    if (d.includes('e')) w = clamp(r0.w + dx, WIN_MIN.w, st.w - r0.x);
    if (d.includes('s')) h = clamp(r0.h + dy, WIN_MIN.h, st.h - r0.y);
    if (d.includes('w')) { x = clamp(r0.x + dx, 0, r0.x + r0.w - WIN_MIN.w); w = r0.x + r0.w - x; }
    if (d.includes('n')) { y = clamp(r0.y + dy, MB_H, r0.y + r0.h - WIN_MIN.h); h = r0.y + r0.h - y; }
    S.win.x = x; S.win.y = y; S.win.w = w; S.win.h = h;
  }
  applyWin();
});
function winDragEnd() { if (!WDRAG) return; const d = WDRAG; WDRAG = null; try { $('#win').releasePointerCapture(d.id); } catch (err) { /* ignore */ } if (d.moved) saveWin(); }
document.addEventListener('pointerup', winDragEnd);
document.addEventListener('pointercancel', winDragEnd);
$('#win').addEventListener('dblclick', (e) => { if (e.target.closest('.tbar,.wtop') && !e.target.closest(BAR_SKIP)) winZoomToggle(); });
$('#win').addEventListener('transitionend', (e) => { if (e.target !== $('#win')) return; if (e.propertyName === 'grid-template-columns' || e.propertyName === 'transform') { layoutChanged(); placeDeps(); } });
/* settings panel: drag by its title row (position kept in S.setPos, re-clamped on resize by setPlace()) */
let PDRAG = null;
$('#set').addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || !e.target.closest('.ptop') || e.target.closest('button')) return;
  const el = $('#set'); const r = el.getBoundingClientRect(), d = desk.getBoundingClientRect();
  PDRAG = { sx: e.clientX, sy: e.clientY, x0: r.left - d.left, y0: r.top - d.top, w: r.width, h: r.height, moved: false, id: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
  if (!PDRAG) return; const st = stageSize();
  if (!PDRAG.moved) { if (Math.hypot(e.clientX - PDRAG.sx, e.clientY - PDRAG.sy) < 3) return; PDRAG.moved = true; try { $('#set').setPointerCapture(PDRAG.id); } catch (err) { /* ignore */ } }
  S.setPos = { x: clamp(PDRAG.x0 + e.clientX - PDRAG.sx, 0, Math.max(0, st.w - PDRAG.w)), y: clamp(PDRAG.y0 + e.clientY - PDRAG.sy, MB_H, Math.max(MB_H, st.h - PDRAG.h)) };
  setPlace(); sheetPlace();
});
function setDragEnd() { if (!PDRAG) return; const d = PDRAG; PDRAG = null; try { $('#set').releasePointerCapture(d.id); } catch (err) { /* ignore */ } }
document.addEventListener('pointerup', setDragEnd);
document.addEventListener('pointercancel', setDragEnd);
/* full screen: the menu bar peeks back when the pointer touches the top edge */

/* ============ shared visuals ============ */
const agent = (id) => AGI[id];
const CUR = {};
const OUT = { ok: ['okc', 'var(--good)', '完成'], part: ['half', 'var(--warn)', '部分完成'], fail: ['xc', 'var(--crit)', '放弃'], live: ['clock', 'var(--a1)', '运行中'] };
function spark(arr, w, h) {
  w = w || 64; h = h || 22;
  const mn = Math.min(...arr), mx = Math.max(...arr);
  const pts = arr.map((v, i) => [2 + i * ((w - 4) / Math.max(1, arr.length - 1)), 2 + (1 - (v - mn) / ((mx - mn) || 1)) * (h - 4)]);
  const last = pts[pts.length - 1];
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true" style="overflow:visible;flex:none"><path d="M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + '" fill="none" stroke="var(--ink-4)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.5" fill="var(--ink-1)" stroke="var(--surface)" stroke-width="1.5"/></svg>';
}
function weekly(fn, endDay, n) { const out = []; for (let k = n - 1; k >= 0; k--) { const b = endDay - k * 7, a = b - 6; out.push(fn(ALL.filter((s) => s.d >= a && s.d <= b && pass(s, { noExtra: true })))); } return out; }
const pt = (C, r, a) => [C + r * Math.sin(a), C - r * Math.cos(a)];
function petal(C, deg, L) {
  const a = deg * Math.PI / 180, w = 0.42;
  const tip = pt(C, L, a), c1 = pt(C, L * 0.62, a + w), c2 = pt(C, L * 0.62, a - w);
  return 'M' + C + ' ' + C + 'Q' + c1[0].toFixed(1) + ' ' + c1[1].toFixed(1) + ' ' + tip[0].toFixed(1) + ' ' + tip[1].toFixed(1) + 'Q' + c2[0].toFixed(1) + ' ' + c2[1].toFixed(1) + ' ' + C + ' ' + C + 'Z';
}
const DIRS = { D: 0, S: 180, I: 90, P: 270, M: 45, F: 225, V: 315, T: 135 };
function petals(p, C, scale) {
  let major = '', minor = '';
  const vals = { D: p.v.D, S: 100 - p.v.D, I: p.v.I, P: 100 - p.v.I, M: p.v.M, F: 100 - p.v.M, V: p.v.V, T: 100 - p.v.V };
  Object.keys(DIRS).forEach((k) => { const big = vals[k] >= 50; const d = petal(C, DIRS[k], (16 + vals[k] * 0.56) * scale); if (big) major += d; else minor += d; });
  return { major, minor };
}
function glyphSVG(p, size) {
  const g = petals(p, 40, 0.68);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 80 80" aria-hidden="true"><path d="' + g.minor + '" fill="var(--h2)"/><path d="' + g.major + '" fill="var(--ink-1)"/></svg>';
}
function fpSVG(L, p, size, opt) {
  opt = opt || {};
  const C = 200;
  let hours = '';
  const hc = new Array(24).fill(0); L.forEach((s) => { hc[s.h]++; });
  const hm2 = Math.max(1, ...hc);
  for (let k = 0; k < 48; k++) { const h = Math.floor(k / 2); const v = (k % 2 === 0 ? hc[h] : (hc[h] + hc[(h + 1) % 24]) / 2) / hm2; const a = (k + 0.5) / 48 * Math.PI * 2; const p1 = pt(C, 100, a), p2 = pt(C, 104 + v * 24, a); hours += 'M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'L' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1); }
  const dots = L.map((s) => { const a = (s.h + s.mi / 60) / 24 * Math.PI * 2; const q = pt(C, 140 + Math.min(s.dur, 126) / 126 * 40, a); const r = (2.3 + Math.min(s.msgs, 20) / 20 * 2).toFixed(1); return '<circle class="fpd" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + r + '" fill="' + agent(s.a).c + '" stroke="var(--surface)" stroke-width="1.2"' + (opt.interactive ? ' data-tf="sess|' + s.id + '" data-act="openSession" data-id="' + s.id + '" style="cursor:pointer"' : '') + '/>'; }).join('');
  const g = petals(p, C, 1);
  const lbl = opt.labels ? Object.keys(DIRS).map((k) => { const vals = { D: p.v.D, S: 100 - p.v.D, I: p.v.I, P: 100 - p.v.I, M: p.v.M, F: 100 - p.v.M, V: p.v.V, T: 100 - p.v.V }; const q = pt(C, 16 + vals[k] * 0.56 + 11, DIRS[k] * Math.PI / 180); return '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + 4).toFixed(1) + '" text-anchor="middle" font-size="11" font-family="var(--mono)" font-weight="' + (vals[k] >= 50 ? 700 : 500) + '" fill="' + (vals[k] >= 50 ? 'var(--ink-1)' : 'var(--ink-3)') + '">' + k + '</text>'; }).join('') + [['00', 0], ['06', 90], ['12', 180], ['18', 270]].map((h) => { const q = pt(C, 194, h[1] * Math.PI / 180); return '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + 3.5).toFixed(1) + '" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink-3)">' + h[0] + '</text>'; }).join('') : '';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 400 400" role="img" aria-label="协作指纹：内核是四个维度，中环是 24 小时节律，外环每个点是一个会话" style="overflow:visible;max-width:100%;height:auto"><circle cx="200" cy="200" r="186" fill="var(--surface)" stroke="var(--line)"/><circle cx="200" cy="200" r="132" fill="none" stroke="var(--hair)"/><circle cx="200" cy="200" r="96" fill="none" stroke="var(--line)"/><circle cx="200" cy="200" r="68" fill="var(--bg)" stroke="var(--hair)"/><g class="hours"><path d="' + hours + '" fill="none" stroke="var(--ink-3)" stroke-width="3.2" stroke-linecap="round"/></g><g class="dots">' + dots + '</g><g class="pet"><path d="' + g.minor + '" fill="var(--h2)"/><path d="' + g.major + '" fill="var(--ink-1)"/></g><circle cx="200" cy="200" r="5" fill="var(--surface)" stroke="var(--ink-1)" stroke-width="1.5"/>' + lbl + '</svg>';
}
TIPS.sess = (id) => { const s = BYID[id]; if (!s) return ''; return '<b>' + esc(s.title) + '</b>\n<span class="mono" style="opacity:.8;font-size:11px">' + agent(s.a).name + ' · ' + md(s.d) + ' ' + hm(s.h, s.mi) + ' · ' + dur(s.dur) + '</span>'; };

/* ============ VZ · shared visualization kit ============
 *
 * 用法（页面）：
 *   PAGES.foo = () => '… <div class="vz" data-vz="trend"></div> …';
 *   PAGES.foo.after = () => VZ.mount($('[data-vz="trend"]'), spec);
 * 组件按容器实际像素宽度与 spec.height 渲染 SVG：文字、线宽、点大小恒定像素，不随宽度缩放。
 * 容器尺寸变化（ResizeObserver）或 window 'tandem:layout' 事件触发时自动重绘。
 *
 * 入口：
 *   VZ.mount(el | selector, spec) -> inst       挂载/更新；el 需有可测量宽度；返回实例 { el, spec, hidden, focus, redraw() }
 *   VZ.svg(spec, w, h) -> string                同一 spec 直接得到 <svg> 字符串（测试、导出、分享卡）
 *   VZ.html(spec, w, h) -> string               图例 + svg + tooltip 容器（无交互绑定）
 *   VZ.table(spec) -> string                    表格视图（与图表同数据；每种类型都有）
 *   VZ.setView(el, 'chart' | 'table')           图表 ↔ 表格切换（也可直接 spec.view）
 *   VZ.spark(values, opt) / VZ.kpi(opt)         迷你趋势线 / KPI tile（返回 HTML，不必 mount）
 *   VZ.color(i)                                 第 i 个系列的颜色：var(--a1..--a5)；第 6 个起折叠为灰色「其他」
 *   VZ.sem                                      语义色 { err 失败, corr 纠偏/异常, good 改善, neg/pos 情绪发散, accent 选中, bar/barStrong 中性条 }
 *   VZ.fmt(v, f), VZ.ticks(a, b, n), VZ.timeTicks(t0, t1, px), VZ.scale.linear/band, VZ.time.*, VZ.delta2(d)  工具函数
 *
 * 所有类型共用的 spec 字段：
 *   type       见下表                          title     图表名（写进 <title> 与 aria-label）
 *   desc       aria 补充说明                    height    绘图区高度 px（含坐标轴；默认按类型）
 *   legend     false 隐藏；'top'|'bottom'（默认 top；单系列自动不显示）。点击 = 显示/隐藏，⌥ 点击 = 只看该系列，悬停 = 其他淡出
 *   hidden     初始隐藏的系列名数组              view      'chart' | 'table'
 *   empty      空数据文案（默认「暂无数据」）     minN / n  样本门槛：n < minN 时显示「样本不足 n / minN」
 *   head       { eyebrow, title, sub, evidence: { label, act, attrs }, right }  图表头（VZ.head；等宽眉标 + 结论句标题 + 口径说明）
 *   animate    false 关闭首次绘制的入场动画（线描入、柱升起、点弹出；prefers-reduced-motion 下自动关闭）
 *   onHover(i, d) onSelect(i, d) onBrush([a, b], meta) onLegend(name, visible, { hidden }) onFocus(i, d)  回调
 *   brush      true 允许在绘图区拖选（line/area/bar/histogram/timeline/scatter）
 *   selected   当前选中项（索引或 id），用描边高亮
 *   refs       [{ y, label, color }]           横向参考线（目标线）
 *   bands      [{ from, to, label }]           x 区间带（如「安装后」）
 *   marks      [{ x, label }]                  x 竖线标注
 *   notes      [{ i | x, y, text, series }]    callout 标注
 *   x          { values: [...], type: 'band' | 'time' | 'linear', label, format }   time 用毫秒时间戳；band 用文字
 *   y          { min, max, zero, label, format, ticks }   format: 'int' | '1f' | 'pct' | 'k' | 函数 | '{v} h'
 *
 * 类型与专有字段：
 *   line / area   series: [{ name, values: [n|null], color, band: [[lo, hi]], dash, width, area }]，curve: 'monotone'，endLabels，points
 *   bar           series 同上；stacked，horizontal，err: 每系列 { err: [n] } 误差；x.values 为类别；labels: true | 'max'；hatch: [i] 斜纹标未完成的桶
 *   histogram     values: [n]，bins（数量）或 edges: [n]，format；marks 可标均值
 *   diverging     rows: [{ name, value, left, right, ref }]，domain: [-1, 1]，colors: [负, 正]（默认情绪发散色），deadband: [a, b] 中间「未定型」带，format
 *   ranked        rows: [{ name, value, share, meta, flag, id }]，top（前 k 深色、其余浅灰），format，barH（默认 8）
 *   share         items: [{ name, value, color }]，单条 100% 比例条 + 图例
 *   bullet        rows: [{ name, value, target, ranges: [q1, q2, q3], format }]，max
 *   dumbbell      rows: [{ name, a, b, id }]，labels: ['安装前', '安装后']，format，goodDown
 *   slope         同 dumbbell 字段，纵向两列对比
 *   heatmap       rows: [str]，cols: [str]，values: [[n]]，ramp: 'gray' | 'accent' | 'err' | 'corr' | 'good' | 'mood'（发散，值域自动对称）| 任意 var()，showValues，peak，cellMax，format，min / max
 *                 layout: 'calendar' 时 days: [{ t, v }]（t 毫秒）
 *   scatter       points: [{ x, y, r, label, id, color, series }]，fit（回归 + 95% CI），labels，rMax，x/y 同上
 *   dist          rows: [{ name, values: [n] }]，mode: 'box' | 'dots'，format
 *   flow          nodes: [{ id, name, col }]，links: [{ from, to, value }]，format
 *   timeline      lanes: [{ id, label, h, color, mode: 'density' }]，events: [{ lane, t, t2, kind: 'tick' | 'dot' | 'ring' | 'span', color, label, sub, detail, err, id, dim }]
 *                 range: [t0, t1]，unit: 'ms' | 'min'（min 时 start 为起始时刻的分钟数，刻度显示 HH:MM），playhead（之后的事件变淡），now（运行中：竖线 + 脉冲点）
 *                 spans: [{ t, t2, label, color, inferred }] 阶段带；markers: [{ t, label, n, alert }] 关键时刻徽章（相距 < 20px 自动合并成簇）
 *                 mode: 'density' 的泳道把事件按 bucket px（默认 4）聚合成密度块（高度对数、失败叠红），hover 列出桶内事件
 *                 onSelect(i, d)：d 为事件本身，或 { bucket: true, lane, t0, t1, n, err, events }，或 { marker: true, t, markers }
 *                 axisMode: 'time' | 'steps'（事件等距、跨度固定 1 步、刻度每 k 步）；zoom: false 关闭 ⌘/Ctrl + 滚轮以光标为锚的缩放（1 – maxZoom，默认 12 倍）；
 *                 缩放改写 spec.range 并把全程记在 spec.extent，触发 onView(range | null, { zoom, full })；⇧ + 滚轮平移
 *                 回放：playhead 可拖动（snap: false 关闭吸附），onPlayhead(t, { done })；VZ.playhead(el, t, { playing }) 逐帧定位不重绘；
 *                 VZ.replay(el, { ms: 8000, rate, realtime, onTick, onDone }) 内置 rAF 回放（Space 播放 / 暂停，[ ] 逐事件；spec.onPlay(play) 可接管）
 *   minimap       range，events: [{ t, err, user }]（或 density: [n]），window: [a, b]（当前视窗，null = 全程），bins，axis，onView(range | null, { px, done, full })
 *                 总览条：密度面积 + 失败刻 + 你的消息点 + 可拖视窗（拖动平移、拖手柄缩放、点空白跳转、双击 / Home 复位、← → 平移、↑ ↓ 缩放）
 *   multiples     items: [{ title, spec }]，minW，shareY，height
 *   spark         values: [n]（也可 VZ.spark(values, { w: 80, h: 24, area, bars, color, last, ref, label }) 直接得到 HTML；默认 --ink-3 线 + 强调色末点）
 *   kpi           VZ.kpi({ label, value, unit, delta: { cur, prev, unit: 'pct' | 'pt' | 'x', goodDown }, trend, trendLabel, sub, act, tip })：环比 = ▲▼ + 变化量 + 上期值
 *
 * 颜色只用 CSS 变量：系列色 --a1..--a5 只表示 Agent 身份；语义色走 VZ.sem（--vz-err / --vz-corr / --vz-good / --vz-mood-neg / --vz-mood-pos，缺省回落主题色）；
 * 强调色 var(--accent) 在外壳里就是墨色（单色控件体系，蓝色只留给焦点环），只用于选中 / 当前 / 刷选 / 迷你线末点；AI 紫 --ai；灰阶 --h0..--h5；墨色 --ink-1..4；单系列条默认中性灰。
 * 文字永远用墨色（--ink-*），颜色只落在图元上；浅深色自动适配；reduced-motion 下无过渡。
 */
const VZ = { types: {}, _inst: new WeakMap(), ACC: 'var(--accent, #17181b)', _uid: 0 };
// 语义色（评审 §4：一个颜色只对应一个含义）。值是 36-viz.css 的 --vz-* 变量，缺省回落到主题的 crit / good 与琥珀 / 冷紫 / 青绿。
VZ.sem = { err: 'var(--vz-err)', corr: 'var(--vz-corr)', good: 'var(--vz-good)', neg: 'var(--vz-mood-neg)', pos: 'var(--vz-mood-pos)', accent: 'var(--accent, #17181b)', bar: 'var(--ink-4)', barStrong: 'var(--ink-3)' };
// 第 i 个系列的颜色；传入系列总数 n === 1 时（单一度量的柱 / 条）用中性 --ink-3，Agent 五色只表示身份（评审 G-03）
VZ.color = (i, s, n) => (s && s.color) || (n === 1 ? 'var(--ink-3)' : i < 5 ? 'var(--a' + (i + 1) + ')' : 'var(--h3)');
// 斜纹（未完成的末桶、推断值）：每张 svg 自带一份 <pattern>，id 唯一

/* The running session's recent events, from its trajectory (traj, 42-a3-sessions.js) rather than random ticks (S-V04).
   The trajectory's times are spread over the minutes elapsed so far, then counted into `bucketSec` buckets covering the
   last `minutes` minutes: { b: [{ tool, err, user }], from, now } (minutes since session start). */
function liveBuckets(minutes, bucketSec) {
  const s = BYID[LIVE_ID]; const tr = traj(s); const now = Math.max(1, (Date.now() - S.live.t0) / 60000);
  const k = now / tr.T, n = Math.max(1, Math.round(minutes * 60 / bucketSec)), from = now - minutes;
  const b = []; for (let i = 0; i < n; i++) b.push({ tool: 0, err: 0, user: 0 });

    const t = e.t * k; if (t < from || t > now) return;

/* ============ simulated events ============
   Two ambient channels, driven by the notification matrix (settings › 通知) independently (BUG-40):
     S.sim     = menu-bar badge (column 菜单栏角标)        S.hudSim = floating HUD (column 悬浮组件)
   S.simBase is the resting state ('running' | 'idle') both channels fall back to once an alert is cleared or a「完成」
   has been shown for 8 s (BUG-41). S.attn (the panel's「需要关注」list) is kept whenever either channel got the event. */
const SIM_CH = { sim: 2, hudSim: 1 };
function simChanOn(c, k) { const ch = S.notif[k] || [1, 1, 1]; return !!ch[SIM_CH[c]] && !(c === 'hudSim' && S.hud.mute); }
/* the latest event a channel received is what it shows; once something is cleared the channel re-derives its state from
   what is still open — failing command, context, an unanswered confirmation — else rests (BUG-74 / BUG-41) */
S.waitOpen = S.waitOpen || false;
// a finished session shows on the badge for 8 s by default (as published); the matrix can turn the column off
S.notif.done = [1, 1, 1];
function simSettle(force) {
  Object.keys(SIM_CH).forEach((c) => {
    if (!force && S[c] === 'done') return;
    S[c] = S.attn.has('stuck') && simChanOn(c, 'stuck') ? 'stuck' : S.attn.has('ctx') && simChanOn(c, 'ctx') ? 'ctx' : S.waitOpen && simChanOn(c, 'waiting') ? 'waiting' : S.simBase;
  });
}
function simIdle() { return S.simBase === 'idle' || S.sim === 'idle'; }
/* an event that was handled (「去处理」,「查看」) leaves every channel that still shows it */
function simClear(kind) { if (kind === 'waiting') S.waitOpen = false; Object.keys(SIM_CH).forEach((c) => { if (S[c] === kind) S[c] = S.simBase; }); simSettle(); }
function simEvent(k) {
  const eventAgent = { done: 'cc', waiting: 'cx', stuck: 'cx', ctx: 'cc' }[k];
  if (eventAgent && !sourceEnabled({ a: eventAgent })) { toast(agent(eventAgent).name + ' 的数据源已停用，不会产生提醒'); return; }
  if (S.paused && k !== 'newsrc') { toast('采集已暂停，不会产生事件', { act: '恢复采集', onAct: () => { S.paused = false; render(); } }); return; }
  if (k === 'idle' || k === 'running') {
    S.simBase = k; S.attn.clear(); S.waitOpen = false; clearTimeout(SIMT); simSettle(true); if (k === 'idle') S.hud.open = false; render();
    toast(k === 'idle' ? '已切换为空闲：没有运行中的会话，悬浮组件自动隐身' : '已恢复为有会话运行中'); return;
  }
  const ch = S.notif[k] || [1, 1, 1]; const banner = !!ch[0] && !S.hud.mute;
  const toHud = simChanOn('hudSim', k), toBadge = simChanOn('sim', k); const ambient = toHud || toBadge;
  const doneS = BYID[DONE_ID];
  const N = {
    done: { t: '会话完成 · ' + PJI[doneS.p].name, b: agent(doneS.a).name + ' · ' + dur(doneS.dur) + ' · ' + doneS.tools + ' 步 · 推送了 2 个提交', a1: '查看轨迹', on1: () => ACT.hudTraj(), a2: '稍后' },
    waiting: { t: 'Codex 等你确认', b: 'team-hub · 请求执行 git push origin collab', a1: '在终端中处理', on1: () => ACT.hudGo({ dataset: { v: 'waiting' } }), a2: '稍后' },
    stuck: { t: '同一命令连续失败 4 次', b: 'Codex · Surge 规则 · python gen_rules.py --publish。可能是 CDN token 过期', a1: '查看原因', on1: () => { S.pop = true; render(); }, a2: '忽略 1 小时', on2: () => ACT.popIgnore({ dataset: { k: 'stuck' } }) },
    ctx: { t: '上下文即将压缩（78%）', b: 'Claude Code · latentskill · 建议先让 Agent 总结进度再继续', a1: '复制提示语', on1: () => ACT.hudTip() },
    weekly: { t: '每周报告已生成', b: '9 月第 4 周：' + sel({ range: 7, noExtra: true }).length + ' 个会话 · 人格 ' + (personaNow().ok ? personaNow().code : '—') + ' 没有变化', a1: '查看报告', on1: () => openReport() }
  };
  if (k === 'newsrc') {
    const has = () => S.extraSrc.some((x) => /cursor/i.test(x.name));
    if (has()) { toast('Cursor 已经添加过了'); return; }
    // two banners can be open at once: the second「添加」must not add Cursor again (BUG-43)
    notify({ t: '发现新的数据来源', b: 'Cursor 的会话数据库：~/Library/Application Support/Cursor', a1: '添加', on1: () => { if (has()) { toast('Cursor 已经添加过了'); return; } S.extraSrc.push({ name: 'Cursor', path: '~/Library/Application Support/Cursor/User/workspaceStorage', fmt: 'sqlite', n: 37 }); render(); toast('已添加 Cursor，正在索引 37 个会话（示例）'); }, a2: '忽略', force: true });
    return;
  }
  if (ambient) {
    const set = (v) => { if (toHud) S.hudSim = v; if (toBadge) S.sim = v; };
    if (k === 'done') { set('done'); clearTimeout(SIMT); SIMT = setTimeout(() => { simClear('done'); render(); }, 8000); }
    else if (k === 'waiting') { S.waitOpen = true; set('waiting'); }
    else if (k === 'stuck') { S.attn.add('stuck'); set('stuck'); }
    else if (k === 'ctx') { S.attn.add('ctx'); set('ctx'); }
    render();
  }
  if (banner) notify(N[k]);
  if (!banner && !ambient) toast(S.hud.mute && (ch[0] || ch[1]) ? '提醒已暂停：横幅与悬浮组件都没有打扰你' : '「' + N[k].t + '」的所有提醒渠道都已关闭');
  else if (!banner) toast(S.hud.mute ? '提醒已暂停，只更新了菜单栏角标' : '这类事件的横幅已在通知设置中关闭');
}

/* ============ keyboard ============ */
// Dispatch order: palette / dropdown / reveal specifics → Escape chain (overlay, sheet, menu, panel, HUD, settings, sidebar
// overlay) → page hook PAGES[S.route].keys(e) (return true = handled; skipped while a sheet, overlay or menu is open or the
// settings window is key) → Return in a sheet = default button → global shortcuts.
// Demo bindings (browser-safe; the App uses ⌘ where noted): ⌥1–9 pages (⌘1–9), ⌥0 main window (⌘0), ⌃⌘S sidebar, ⌃⌘F full
// screen, ⌘M minimise, ⌘K palette, ⌘, settings, ⇧⌘S share card, ⇧⌘E report, ⌥⌘P HUD, ⌃⌥T panel, ⌥R reindex (⌘R), ⌥T chart/table
// (⌘T), ⌘F find, ⌘↩ main action, ⌘Z undo install, ⌘[ back, ? shortcuts, Space play/pause (sessions).
document.addEventListener('keydown', (e) => {
  const tg = e.target; const tag = (tg.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || tg.isContentEditable;
  const mod = e.metaKey || e.ctrlKey;
  const modalOpen = !$('#modal').hidden, ovOpen = !$('#overlay').hidden, setOpen = !$('#set').hidden;
  if (MODAL_KEY === 'palette' && modalOpen && PAL) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PAL.i = clamp(PAL.i + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, PAL.items.length - 1)); drawPal(); return; }
    if (e.key === 'Enter') { e.preventDefault(); const it = PAL.items[PAL.i]; closeModal(); if (it) it.run(); return; }
  }
  if (tg.id === 'askIn' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ACT.askSend(); return; }
  if (DD && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); const bs = $$('#dd button[data-i]:not([disabled])'); if (!bs.length) return;
    let i = bs.findIndex((b) => b.classList.contains('act')); bs.forEach((b) => b.classList.remove('act'));
    i = i < 0 ? (e.key === 'ArrowDown' ? 0 : bs.length - 1) : (i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length;
    bs[i].classList.add('act'); bs[i].scrollIntoView({ block: 'nearest' }); return;
  }
  if (DD && e.key === 'Enter') { const b = $('#dd button.act'); if (b) { e.preventDefault(); b.click(); return; } }
  if (OVL === 'reveal' && REV && !REV.done) { if (e.key !== 'Tab') { e.preventDefault(); revealSkip(); } return; }
  if (e.key === 'Escape') {
    if (ovOpen) { closeOverlay(); render(); return; }
    if (modalOpen) { clearInterval(ASKT); closeModal(); return; }
    if (DD) { closeDD(); return; }
    if (S.pop) { S.pop = false; render(); return; }
    if (S.hud.open) { S.hud.open = false; renderHud(); return; }
    if (setOpen && S.keyWin === 'set') { closeSettings(); return; }
    if (S.sideOver) { S.sideOver = false; applyWin(); renderWtop(); return; }
  }
  if (!modalOpen && !ovOpen && !DD && S.keyWin === 'main') {
    const pg = PAGES[S.route];
    if (pg && typeof pg.keys === 'function' && pg.keys(e) === true) { if (!e.defaultPrevented) e.preventDefault(); return; }
  }
  if (modalOpen && MODAL_HOST && e.key === 'Enter' && !e.isComposing && tag !== 'textarea' && tag !== 'button' && tag !== 'a' && !e.shiftKey && !mod) {
    const p = $$('#modal .mf .btn.p:not([disabled])').pop(); if (p) { e.preventDefault(); p.click(); return; }
  }
  if (tg.id === 'hudPill' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.hud.open = !S.hud.open; renderHud(); const p = $('#hudPill'); if (p) p.focus(); return; }
  if (ovOpen) return;
  if (e.ctrlKey && e.altKey && e.code === 'KeyT') { e.preventDefault(); S.pop = !S.pop; render(); return; }
  if (e.ctrlKey && e.metaKey && e.code === 'KeyS') { e.preventDefault(); toggleSide(); return; }
  if (e.ctrlKey && e.metaKey && e.code === 'KeyF') { e.preventDefault(); winFullToggle(); return; }
  if (mod && e.altKey && e.code === 'KeyP') { e.preventDefault(); toggleHud(); return; }
  if (mod && !e.altKey && !e.shiftKey && e.code === 'KeyK') { e.preventDefault(); if (MODAL_KEY === 'palette' && modalOpen) closeModal(); else { closeModal(); openPalette(); } return; }
  if (mod && e.key === ',') { e.preventDefault(); closeModal(); openSettings(); return; }
  if (mod && e.shiftKey && e.code === 'KeyS') { e.preventDefault(); closeModal(); openShare(); return; }
  if (mod && e.shiftKey && e.code === 'KeyE') { e.preventDefault(); closeModal(); openReport(); return; }
  if (modalOpen) return;
  if (mod && !e.shiftKey && !e.altKey && e.code === 'KeyZ' && !typing) { e.preventDefault(); undoInstall(); return; }
  if (mod && !e.altKey && e.code === 'KeyF') { e.preventDefault(); findCmd(); return; }
  if (mod && e.key === 'Enter') { e.preventDefault(); mainAction(); return; }
  if (mod && !e.altKey && !e.shiftKey && e.code === 'KeyM' && !typing) { e.preventDefault(); ACT.winMin(); return; }
  if ((mod || e.altKey) && e.code === 'BracketLeft' && !typing) { e.preventDefault(); goBack(); return; }
  if (e.altKey && !mod && /^Digit[1-9]$/.test(e.code)) { e.preventDefault(); go(ROUTES[+e.code.slice(5) - 1][0]); return; }
  if (e.altKey && !mod && e.code === 'Digit0') { e.preventDefault(); showMain(); return; }
  if (e.altKey && !mod && e.code === 'KeyR') { e.preventDefault(); reindex(); return; }
  if (e.altKey && !mod && e.code === 'KeyT') { e.preventDefault(); if (S.route === 'overview') { S.view = S.view === 'chart' ? 'table' : 'chart'; render(); toast(S.view === 'chart' ? '已切换为图表' : '已切换为表格'); } else toast('图表 ↔ 表格只在概览页可用'); return; }
  if (typing) return;
  if (e.key === '?') { e.preventDefault(); openKeys(); return; }
  if (e.key === ' ' && S.route === 'sessions' && !tg.closest('button,a,input,textarea,select,[tabindex]')) { e.preventDefault(); ACT.playToggle(); }
});

    const st = TL.status; const side = $('#side');
    const set = (sel, text) => { const el = side.querySelector(sel); if (el) el.textContent = text; };
    set('[data-r="sessions"] .ct', TLU.num(st && st.counts && st.counts.sessions));
    set('[data-r="projects"] .ct', TLU.num(st && st.counts && st.counts.projects));
    AG.forEach((a) => {
      const keys = TandemLive.AGENT_KEYS[a.id] || [];
      const src = ((st && st.sources) || []).filter((s) => keys.indexOf(String(s.agent || '').toLowerCase()) >= 0);
      const on = src.filter((s) => s.enabled !== false);
      set('.ag[data-a="' + a.id + '"] .ct', !st ? '—' : !src.length ? '—' : !on.length ? '停用' : TLU.num(on.some((s) => s.sessions == null) ? null : on.reduce((n, s) => n + s.sessions, 0)));
    });
    side.querySelectorAll('[data-act="pinProject"] .ct').forEach((el) => { el.textContent = '—'; });
    set('.me .pc', '—');
    set('.sb-foot .pv .row.cap span', st ? '已索引 ' + TLU.num(st.counts && st.counts.sessions) + ' 个会话 · 本机服务' : TL.error ? '本机服务未连接' : '正在连接本机服务');
  };
  renderSet = function () {
    baseSet();
    if ($('#set').hidden || S.setTab !== 'sources') return;
    const card = $$('#set .card').find((x) => { const t = x.querySelector('.ct'); return t && t.textContent === '已检测到的 Agent'; });
    if (!card) return;
    const r = lvSources(); const box = card.lastElementChild;
    box.setAttribute('data-tl', 'sources');
    box.innerHTML = r.data ? ((r.data.sources || []).map((s) => '<div class="srcrow" style="opacity:' + (s.enabled === false ? 0.55 : 1) + '"><div style="min-width:0"><b style="font-size:13px">' + esc(s.name || s.agent) + '</b><div class="cap" style="font-size:11px">' + esc(s.id) + ' · ' + (s.enabled === false ? '已停用' : '已启用') + '</div></div><span class="when">' + TLU.num(s.sessions) + ' 个会话 · ' + TLU.hm(s.last_scan) + '</span></div>').join('') || TLU.empty('尚未发现数据来源'))
      : r.state === 'error' ? TLU.errorCard(r.error) : TLU.skeleton();
  };
  TL.start();
}

/* ============ clock, live counters, init ============ */
let TICK = 0;
setInterval(() => {
  TICK++;
  $$('[data-clock]').forEach((x) => { x.textContent = nowText(); });
  $$('[data-live]').forEach((x) => { x.textContent = liveElapsed(); });
  if (TICK % 4 === 0 && S.sim !== 'idle' && !S.paused) {
    HUD_T++; S.live.tools++;
    $$('[data-hudtool]').forEach((x) => { x.textContent = HUD_TOOLS[HUD_T % HUD_TOOLS.length]; });
    $$('[data-livetools]').forEach((x) => { x.textContent = S.live.tools; });
  }
}, 1000);
// viewport resize: re-clamp the window at once (cheap), redraw the desktop layer after the burst settles
let RZ = null;
window.addEventListener('resize', () => { applyWin(); setPlace(); clearTimeout(RZ); RZ = setTimeout(() => { renderWidgets(); renderHud(); }, 80); });
(function init() {
  document.documentElement.lang = 'zh-CN';
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }
  if (PAGES[h]) S.route = h;
  setTheme(S.theme);
  // desktop widgets sit on the desktop layer, left of the window; shown by default on stages ≥ 1500px (as published), where
  // the default window leaves the column free. 「显示 › 桌面小组件」toggles them at any size.
  S.widgets = window.innerWidth >= WIDE_MIN;
  render();
  setTimeout(() => notify({ t: '欢迎体验 Tandem 交互 Demo', b: '数据都是示例。菜单栏右侧的烧瓶图标是「演示」菜单，可以模拟会话事件、播放首次启动与人格揭晓；' + kb('⌘K') + ' 打开命令面板。', a1: '播放首次启动', on1: () => openOnboarding(0), a2: '知道了', ms: 12000, force: true }), 800);
})();
</script>
