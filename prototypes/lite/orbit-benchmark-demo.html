*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink-1);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;margin:0}
button{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.win{position:absolute;z-index:10;top:46px;bottom:18px;left:24px;right:24px;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--bg);border-radius:14px;box-shadow:var(--sh-win);overflow:hidden;transition:opacity .15s,transform .2s cubic-bezier(.05,.7,.1,1)}
.side{position:relative;margin:8px 0 8px 8px;display:flex;flex-direction:column;min-height:0;background:var(--sb);border:1px solid var(--line);border-radius:12px;padding:0 8px 8px;overflow:hidden}
.lights{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 2px 0 8px}
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.22)}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.lights button:hover::after{content:"";display:block}
.side .search{height:30px;flex:none;margin:0 2px 10px;display:flex;align-items:center;gap:7px;padding:0 6px 0 9px;border-radius:8px;background:var(--field);color:var(--ink-3);border:0;width:calc(100% - 4px);text-align:left}
.side .search span{flex:1;font-size:13px}
.side .sect{font-size:11px;font-weight:600;color:var(--ink-3);padding:12px 10px 4px;display:flex;justify-content:space-between}
.side .sect:first-of-type{padding-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{height:30px;display:flex;align-items:center;gap:9px;padding:0 8px 0 10px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13px;text-align:left;width:100%}
.nav button:hover{background:rgba(127,127,127,.08)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink-1);font-weight:600;box-shadow:var(--sh-raise)}
.nav button[aria-current="page"] .ico{color:var(--ink-1)}
.nav .ico{color:var(--ink-3)}
.nav .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ct{font:500 11px/1 var(--mono);color:var(--ink-3)}
.nav .bd{height:18px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--ink-1);color:var(--bg);font:600 10.5px/18px var(--mono);text-align:center}
.nav .ag{height:27px;padding-left:13px}
.nav .ag .dot{width:9px;height:9px}
.nav .ag.off{opacity:.42}
.nav .ag.off .lb{text-decoration:line-through}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.privacy{border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.me{display:flex;align-items:center;gap:9px;padding:0 2px 0 4px}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ink-1);color:var(--bg);font:600 11px/1 var(--mono)}
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.tbar{flex:none;display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 24px 8px 20px;flex-wrap:wrap}
.tbar h1{margin:0;font:600 24px/1.2 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.tbar .meta{font:11.5px/1.4 var(--mono);color:var(--ink-3)}
.tbar .grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.burger{display:none}
.content{flex:1;min-height:0;overflow:auto;padding:0 24px 24px 20px;overscroll-behavior:contain}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* primitives */
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-card);min-width:0}
.pad{padding:14px 16px}
.ct{font-size:13px;font-weight:600;line-height:18px;color:var(--ink-1)}
.cap{font-size:12px;line-height:16px;color:var(--ink-3)}
.eb{font:600 10.5px/14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hd .grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.btn{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-1);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-shadow:0 1px 1px rgba(20,22,26,.03)}
.btn:hover{border-color:var(--ink-4)}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.p:hover{opacity:.9}
.btn.ai{background:var(--ai-bg);border-color:transparent;color:var(--ai);box-shadow:none}
.btn.gh{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.gh:hover{background:var(--field)}
.btn.dg{color:var(--crit)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--ink-2);display:inline-grid;place-items:center;padding:0;flex:none}
.ib:hover{background:var(--field)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--field);flex-wrap:wrap}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:12px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink-1);font-weight:600;box-shadow:var(--sh-raise)}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-1);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink-1);border-color:var(--ink-1);color:var(--surface)}
.chip.dash{border-style:dashed;color:var(--ink-2);background:transparent}
.chip.sm{height:24px;font-size:12px;padding:0 8px}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.bdg{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:var(--sunken);font:500 10.5px/1 var(--mono);color:var(--ink-2);white-space:nowrap}
.aib{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:var(--ai-bg);color:var(--ai);font-size:10.5px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface);font:600 10.5px/1 var(--mono);color:var(--ink-2);white-space:nowrap}
.sw{position:relative;width:30px;height:18px;border-radius:999px;background:var(--line);flex:none;border:0;padding:0}
.sw.on{background:var(--ink-1)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s cubic-bezier(.05,.7,.1,1)}
.sw.on::after{left:14px}
.lnk{font-size:12px;color:var(--ink-1);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);background:none;border:0;padding:0}
.lnk:hover{text-decoration-color:var(--ink-3)}
.lvl{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.lvl i{display:block;width:4px;border-radius:1px;background:var(--line)}
.lvl i.f{background:var(--ink-1)}
.lvl i:nth-child(1){height:4px}.lvl i:nth-child(2){height:7px}.lvl i:nth-child(3){height:10px}.lvl i:nth-child(4){height:12px}
.grid{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ai);animation:spin .9s linear infinite;flex:none;display:inline-block}
.live{animation:pulse 1.8s ease-out infinite}
.caret{display:inline-block;width:7px;height:13px;background:currentColor;vertical-align:-2px;animation:blink 1s steps(2) infinite}
.shim{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--hair) 0%,var(--line) 50%,var(--hair) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,96,43,.5)}70%{box-shadow:0 0 0 7px rgba(226,96,43,0)}100%{box-shadow:0 0 0 0 rgba(226,96,43,0)}}
@keyframes blink{50%{opacity:0}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade{animation:fadein .15s cubic-bezier(.05,.7,.1,1)}
.stale{opacity:.45;transition:opacity .15s}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:500;font-size:11px;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr.sel td{background:var(--bg)}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit}
.tbl tr.click{cursor:default}
.tbl tr.click:hover td{background:var(--bg)}
.scroll-x{overflow-x:auto;max-width:100%}
.scrim{position:absolute;inset:0;z-index:90;background:var(--scrim)}
.modal{position:absolute;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 60px);overflow:auto;border-radius:14px;background:var(--raised);box-shadow:var(--sh-pop);color:var(--ink-1)}
.modal.wide{width:min(820px,calc(100% - 32px))}
.modal.full{width:min(980px,calc(100% - 32px))}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 0}
.modal .mh h2{margin:0;font:600 20px/1.25 var(--serif);flex:1;min-width:0}
.modal .mb{padding:14px 20px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px 18px;flex-wrap:wrap}
.toast{position:absolute;z-index:120;left:50%;bottom:28px;transform:translateX(-50%);min-height:38px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:6px;padding:7px 8px 7px 14px;border-radius:12px;background:var(--tip);color:var(--tip-ink);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.24);animation:fadein .15s cubic-bezier(.05,.7,.1,1)}
.toast button{height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--toast-act);font-weight:600;font-size:13px}
.tip{position:fixed;z-index:130;pointer-events:none;max-width:280px;background:var(--tip);color:var(--tip-ink);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.22);white-space:pre-line}

/* Benchmark refinement: original palette and window geometry, simpler density. */
body{font-size:13px}button{cursor:pointer}button:disabled{cursor:default}
[hidden]{display:none!important}h2,h3,p{margin:0}h2{font:600 19px/1.35 var(--serif)}h3{font-size:13px}
.desk{height:100%;position:relative}.desktop-label{height:30px;display:flex;align-items:center;gap:18px;padding:0 24px;font-size:11px;color:var(--ink-2);background:var(--menubar)}
.desktop-label b{color:var(--ink-1);font-size:12px}.stage-meta{margin-left:auto;font-family:var(--mono);font-size:10px}
.win{top:46px;bottom:18px;grid-template-columns:220px minmax(0,1fr)}
.side{overflow:auto;padding-bottom:12px}.side .sect{padding-top:19px}.nav button{height:34px}.side-brand{display:flex;align-items:center;gap:8px;padding:0 10px 14px;font:600 22px var(--serif)}
.side-brand{white-space:nowrap;font-size:21px;gap:7px}.side-brand svg{flex:none}.side-brand small{font:11px var(--sans);color:var(--ink-3);margin-left:2px}.lights{height:42px}.lights i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.side .search{height:32px;font-size:11px;gap:6px}.side .search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:11px}.side .search .kbd{flex:none;font-size:10px}.side .foot{padding-top:22px}.privacy{font-size:11px;line-height:1.6;color:var(--ink-3)}.privacy .row{color:var(--ink-2);font-weight:600}.me .identity{flex:1}.me .cap{font-size:10px}.tbar .burger{display:none}
.tbar{min-height:78px;padding:16px 28px 12px;gap:8px}.tbar .grow{display:block}.tbar .meta{font:11px/1.5 var(--sans);margin-top:5px}.tbar h1{font-size:26px}.content{padding:0 28px 28px;scrollbar-gutter:stable}
.actions{display:flex;align-items:center;gap:6px}.btn{height:30px}.filterline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.filterline .spacer{flex:1}.scope-note{font-size:10.5px;color:var(--ink-3)}
.select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:5px 26px 5px 9px;font-size:12px;min-height:30px;max-width:210px}.search-field{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.search-field input{border:0;outline:none;background:transparent;width:100%;min-width:0}.search-field:focus-within{outline:2px solid var(--focus);outline-offset:2px}

// Stable per-session measurements make every filtered total reconcile.
ALL.forEach(s=>{
  s.corr=Math.min(s.corr,s.msgs);
  const random=rng(hash(s.id+'measurements'));
  const counts=largestRemainder(TOOLS.map(t=>t[1]*(.7+random()*.6)),s.tools);
  const failures=Array(counts.length).fill(0);
  for(let n=0;n<s.errors;n++){
    const available=counts.map((v,i)=>v>failures[i]?v*TOOLS[i][2]:0);
    let chosen=Number(pickW(random,available));
    if(counts[chosen]<=failures[chosen]) chosen=counts.findIndex((v,i)=>v>failures[i]);
    if(chosen>=0) failures[chosen]++;
  }
  s.toolMetrics=counts.map((n,i)=>({name:TOOLS[i][0],n,errors:failures[i],seconds:parseFloat(TOOLS[i][3])*n*(.7+random()*.6)}));
  const langs=LANGUAGES[s.p];
  s.languages=Object.fromEntries(langs.map((l,i)=>[l,Math.round((15+random()*65)/(i+1))]));
  s.phrases=PHRASES.map((_,i)=>i<4 ? (s.corr && (hash(s.id+i)>>>0)%3===0 ? s.corr:0) : (hash(s.id+i)>>>0)%4===0 ? 1:0);

<div><span class="eb">0${i+1} / ${ax.dim}</span><h3 style="margin-top:7px">${ax.q}</h3></div><span class="axis-value">${v?Math.round(v.strong)+'<small class="small">%</small>':'—'}</span></div><div class="scale">${v?`<i style="left:${v.pos}%"></i>`:''}</div><div class="row between small"><span>${ax.L} · ${ax.Ln}</span><span>${ax.R} · ${ax.Rn}</span></div><p class="note" style="margin-top:14px">${ax.sig}</p><div class="note" style="margin-top:8px">${v?(v.val>=45&&v.val<=55?'倾向接近中线，暂不定型':'当前更偏向「'+v.name+'」'):'当前范围样本不足，暂不展示得分'}</div></section>`;}).join('')}</div></div></div>`;};

/* 03 / Sessions and task trajectory */
function matchingSessions(){const q=S.q.trim().toLowerCase();return filtered().filter(s=>!q||(s.title+' '+PJI[s.p].name+' '+AGI[s.a].name).toLowerCase().includes(q)).sort((a,b)=>b.end-a.end);}
function selectedSession(list=matchingSessions()){return list.find(s=>s.id===S.session)||list[0];}
function endedAt(s){const day=Math.floor(s.end/1440),minute=Math.floor(s.end%1440);return md(day)+' '+hm(Math.floor(minute/60),minute%60);}
function taskTimeline(list){const tasks=list.filter(s=>s.verify||s.corr>1).slice(0,6).sort((a,b)=>a.end-b.end);if(!tasks.length)tasks.push(...list.slice(0,3).reverse());const width=Math.max(760,tasks.length*170)*S.zoom;return `<section class="card pad">${titleHTML('关键任务时间轴','按任务最后活跃时间排序',`<div class="row">${button('−','zoom',`data-value="-0.5" aria-label="缩小时间轴" ${S.zoom===1?'disabled':''}`,'sm')}<span class="mono small">${Math.round(S.zoom*100)}%</span>${button('+','zoom',`data-value="0.5" aria-label="放大时间轴" ${S.zoom===3?'disabled':''}`,'sm')}</div>`)}<div class="task-timeline" tabindex="0" aria-label="可横向滚动的关键任务时间轴"><div class="timeline-track" style="width:${width}px">${tasks.map((s,i)=>`<span class="timeline-tick" style="left:${i/tasks.length*100}%">${endedAt(s)}</span><button class="task-node${selectedSession(list)?.id===s.id?' selected':''}" style="left:${i/tasks.length*100}%;width:${Math.min(192,width/tasks.length-18)}px;border-top-color:${AGI[s.a].c}" data-act="session" data-id="${s.id}"><b>${esc(PJI[s.p].titles[PJI[s.p].titles.findIndex(t=>s.title.startsWith(t))]||s.title)}</b><span class="cap">${PJI[s.p].name} · ${s.msgs} 轮</span></button>`).join('')}</div></div><p class="note">展示最近 ${tasks.length} 个含验证或多次纠偏的关键任务；任务摘要为示例。</p></section>`;}
PAGES.sessions=()=>{const list=matchingSessions(),s=selectedSession(list);return `<div class="stack">${list.length?taskTimeline(list):''}<div class="session-layout"><section class="card"><div class="session-list-header"><label class="search-field">${ic('search')}<input type="search" id="sessionQ" data-input="sessions" value="${esc(S.q)}" placeholder="搜索会话或项目" aria-label="搜索会话或项目"></label><div class="row between note" style="padding:10px 0 4px"><span>${list.length} 个会话</span><span>最后聊天时间 ↓</span></div></div><div class="session-list">${list.map(x=>`<button class="session-row${s?.id===x.id?' selected':''}" data-act="session" data-id="${x.id}" aria-pressed="${s?.id===x.id}"><span class="row"><i class="dot" style="background:${AGI[x.a].c}"></i>${AGI[x.a].short}<span style="margin-left:auto">${endedAt(x)}</span></span><span class="title">${esc(x.title)}</span><span class="meta">${PJI[x.p].name} · ${x.msgs} 轮 · ${dur(x.dur)}</span></button>`).join('')||'<p class="note" style="padding:12px">没有匹配会话</p>'}</div></section>${s?sessionDetail(s):empty('没有匹配会话。清空搜索或更换顶部筛选。')}</div></div>`;};
function sessionDetail(s){const state={ok:'完成',part:'部分完成',fail:'未完成'}[s.out];const events=[['00:00','目标与边界',s.title],[dur(s.dur*.12),'读取上下文',`检索项目文件与已有规则，使用 ${toolsFor([s]).filter(t=>t.n).length} 类工具。`],[dur(s.dur*.45),'执行与调整',s.corr?`出现 ${s.corr} 条纠偏反馈；需要重新核对范围与完成条件。`:'根据目标逐步完成修改，保持任务范围。'],[dur(s.dur),s.verify?'结果验证':'本次收尾',s.verify?'检查产出与完成条件，记录验证结果。':'本次未记录明确验证信号，建议补充可核验的检查。']];return `<div class="stack"><section class="card"><div class="session-band" style="border-top-color:${AGI[s.a].c}"><div class="row between note"><span class="row"><i class="dot" style="background:${AGI[s.a].c}"></i>${AGI[s.a].name} / ${PJI[s.p].name}</span>${tag(state)}</div><h2>${esc(s.title)}</h2><span class="note">${md(s.d)} ${hm(s.h,s.mi)} — ${endedAt(s)} · ${dur(s.dur)}</span></div><div class="mini-stats">${[['对话轮数',s.msgs],['工具调用',s.tools],['错误 / 纠偏',s.errors+' / '+s.corr],['Tokens',compact(s.tok)]].map(([label,value])=>`<div class="mini-stat"><span>${label}</span><b>${value}</b></div>`).join('')}</div><div class="pad">${titleHTML('会话轨迹','抽象任务节点 · 示例重建')}${events.map(([time,title,desc])=>`<div class="event"><span class="time">${time}</span><i class="dot"></i><div><b>${esc(title)}</b><p class="note">${esc(desc)}</p></div></div>`).join('')}</div></section><section class="card pad">${titleHTML('从这次协作中得到的启示','',`<span class="aib">${ic('spark')} AI 解读</span>`)}<div class="insight"><div class="row">${ic('recs')} ${s.corr?'先对齐，再让执行继续':'把有效的协作方式留下来'}</div>${s.corr?`本次出现 ${s.corr} 次纠偏，主要涉及「${esc(s.fric||'任务理解')}」。开始前列清修改范围与完成条件，可以让检查更早发生。`:'任务方向较稳定。将目标、验证方式与收尾步骤整理成可重复使用的开场模板。'}</div><div class="row between" style="margin-top:14px"><span class="note">${s.errors?`${s.errors} 次工具失败，建议检查重复失败与环境问题。`:'本次工具调用没有记录失败。'}</span>${button('查看相关建议 '+ic('arrow'),'recommend',`data-id="${s.errors>3?'retry-breaker':'acceptance'}"`,'sm')}</div></section></div>`;}

/* 04 / Tool usage */
PAGES.tools=()=>{const list=filtered(),st=stats(list);if(!list.length)return empty();const rows=toolsFor(list).filter(t=>t.n),task=rows.find(t=>t.name==='Task'),keys={n:'n',err:'err',avg:'avg'};rows.sort((a,b)=>(a[keys[S.toolSort]]-b[keys[S.toolSort]])*S.toolDir);const failures=largestRemainder(FAILS.map(f=>f[1]),st.errors);return `<div class="stack"><div class="tiles tools-tiles">${metric('工具调用次数',fmt(st.tools),'次',`${rows.length} 种工具`,'tools')}${metric('调用成功率',f1((st.tools-st.errors)/st.tools*100),'%',`${fmt(st.errors)} 次调用失败`,'okc')}${metric('子代理调用',fmt(task?.n||0),'次','Task 工具调用，不代表去重代理数','bot')}</div><section class="card pad">${titleHTML('工具使用明细','点击表头排序')}<div class="scroll-x"><table class="tbl"><thead><tr><th>工具名称</th>${[['n','调用次数'],['err','错误率'],['avg','平均耗时']].map(([key,label])=>`<th class="num" aria-sort="${S.toolSort===key?(S.toolDir===-1?'descending':'ascending'):'none'}"><button data-act="sort-tools" data-value="${key}">${label} ${S.toolSort===key?(S.toolDir===-1?'↓':'↑'):'↕'}</button></th>`).join('')}</tr></thead><tbody>${rows.map((t,i)=>`<tr><td><span class="mono">${esc(t.name)}</span>${t.name==='Task'?' <span class="bdg">子代理</span>':''}</td><td class="num">${fmt(t.n)}</td><td class="num" style="color:${t.err>.08?'var(--warn)':'var(--ink-2)'}">${f1(t.err*100)}%</td><td class="num">${f1(t.avg)} s</td></tr>`).join('')}</tbody></table></div></section><div class="two equal"><section class="card pad">${titleHTML('工具调用链','行 → 列 · 下一次调用的条件概率')}<div class="scroll-x"><table class="matrix" style="width:100%"><thead><tr><th>从 / 到</th>${TRANS_NAMES.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${TRANS.map((r,i)=>{const total=sum(r,v=>v);return `<tr><th>${TRANS_NAMES[i]}</th>${r.map(v=>`<td><div class="cell${v===Math.max(...r)?' top':''}" style="${v===Math.max(...r)?'':`background:color-mix(in srgb,var(--ink-1) ${Math.round(v/total*48)}%,var(--surface))`}">${Math.round(v/total*100)}%</div></td>`).join('')}</tr>`;}).join('')}</tbody></table></div><p class="note" style="margin-top:12px">演示转移矩阵为固定样例，不随筛选重估；每行归一化到 100%，取整后可能有尾差。</p></section><section class="card pad">${titleHTML('失败原因',`${fmt(st.errors)} 次失败`)}${st.errors?FAILS.map((f,i)=>`<div class="failure"><div class="row"><span>${f[0]}</span><span class="mono">${fmt(failures[i])} · ${percent(failures[i],st.errors)}</span></div><div class="bar"><i style="width:${failures[i]/st.errors*100}%"></i></div></div>`).join(''):'<p class="note">当前范围没有工具失败。</p>'}<p class="note" style="margin-top:16px">按样例权重分配失败原因；次数与当前筛选的失败总数一致。</p></section></div></div>`;};

/* 05 / Projects */
function projectScatter(rows){const W=560,H=240,max=Math.max(1,...rows.map(r=>r.st.tok/1e6));return `<svg class="chart project-scatter" viewBox="0 0 ${W} ${H}" role="img" aria-label="项目完成度与 Token 使用数散点图"><text x="46" y="13" class="axis-title">完成度 / %</text>${[0,25,50,75,100].map(v=>`<line x1="45" x2="537" y1="${200-v*1.7}" y2="${200-v*1.7}" stroke="var(--line)"/><text x="35" y="${204-v*1.7}" text-anchor="end">${v}</text>`).join('')}${[0,.25,.5,.75,1].map(v=>`<text x="${45+v*472}" y="220" text-anchor="middle">${f1(max*v)}</text>`).join('')}${rows.map(r=>{const x=45+r.st.tok/1e6/max*472,y=200-r.completion*1.7;return `<circle cx="${x}" cy="${y}" r="${7+Math.min(8,r.xs.length/5)}" fill="${S.selectedProject===r.p.id?'var(--ink-1)':'var(--h2)'}" stroke="var(--surface)" stroke-width="2"><title>${r.p.name} · ${f1(r.completion)}% · ${f1(r.st.tok/1e6)}M Tokens</title></circle>${S.selectedProject===r.p.id?`<text x="${x>420?x-15:x+15}" y="${y-8}" text-anchor="${x>420?'end':'start'}">${esc(r.p.name)}</text>`:''}`;}).join('')}<text x="536" y="239" text-anchor="end" class="axis-title">累计 Token / M</text></svg>`;}
PAGES.projects=()=>{const list=filtered();if(!list.length)return empty();const rows=PJ.map(p=>{const xs=list.filter(s=>s.p===p.id),st=stats(xs);return {p,xs,st,completion:xs.length?sum(xs,s=>s.out==='ok'?1:s.out==='part'?.5:0)/xs.length*100:0};}).filter(r=>r.xs.length).sort((a,b)=>b.st.msgs-a.st.msgs),r=rows.find(x=>x.p.id===S.selectedProject)||rows[0];S.selectedProject=r.p.id;const p=persona(r.xs),split=AG.map(a=>({a,n:r.xs.filter(s=>s.a===a.id).length})).filter(a=>a.n);return `<div class="stack"><div class="project-layout"><section class="card pad">${titleHTML('项目概览',rows.length+' 个项目')}${rows.map(x=>`<button class="project-button${r.p.id===x.p.id?' selected':''}" data-act="project-detail" data-id="${x.p.id}" aria-pressed="${r.p.id===x.p.id}"><div><b class="small">${x.p.name}</b><div class="note">${x.xs.length} 会话 · ${f1(x.st.hours)} h</div></div><span class="mono small">${fmt(x.st.msgs)} 轮</span></button>`).join('')}</section><div class="stack"><section class="card pad">${titleHTML(r.p.name,'项目协作概况',button('查看会话 '+ic('arrow'),'project-sessions',`data-id="${r.p.id}"`,'sm'))}<div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:16px"><div><span class="note">对话轮次</span><div class="mono" style="font-size:26px;font-weight:600;margin-top:4px">${fmt(r.st.msgs)}</div></div><div><span class="note">累计协作时长</span><div class="mono" style="font-size:26px;font-weight:600;margin-top:4px">${f1(r.st.hours)}<small class="note"> h</small></div></div></div><div class="composition">${split.map(({a,n})=>`<i style="width:${n/r.xs.length*100}%;background:${a.c}" title="${a.name} ${percent(n,r.xs.length)}"></i>`).join('')}</div><div class="legend">${split.map(({a,n})=>`<span><i class="dot" style="background:${a.c}"></i>${a.short} ${percent(n,r.xs.length)}</span>`).join('')}</div><div class="insight" style="margin-top:18px">${ic('persona')} 此项目的协作人格：<b class="mono">${p.ok?p.code:'暂未定型'}</b> ${p.ok?'· '+p.zh:'· '+r.xs.length+' 个会话，至少需要 30 个'}</div></section><section class="card pad">${titleHTML('规则与配置覆盖','当前项目的配置快照 · 示例')}<div class="coverage">${r.p.cover.map(c=>`<div><span class="small">${c[0]}</span><strong>${c[0]==='AGENTS.md'?(c[3]?'✓':'—'):c[1]}</strong><span class="note">${c[0]==='AGENTS.md'?(c[3]?'已配置 · '+c[1]:'未配置'):c[3]?'已配置':'尚未配置'}</span></div>`).join('')}</div></section></div></div><section class="card pad">${titleHTML('项目完成度 vs Token 使用数','圆大小 = 会话个数 · 选择项目高亮 · 悬停查看数值')}${projectScatter(rows)}<p class="note">完成度为任务结果的示例代理指标：（完成会话 + 0.5 × 部分完成会话）/ 会话总数，不代表真实项目进度。Token 含重复上下文，不能直接等同于费用。</p></section></div>`;};

/* 06 / Feedback and interests */
PAGES.sentiment=()=>{const list=filtered(),st=stats(list);if(!list.length)return empty();const phrases=PHRASES.map((name,i)=>({name,n:sum(list,s=>s.phrases[i])})).sort((a,b)=>b.n-a.n),topics=Object.entries(list.reduce((o,s)=>{o[s.topic]=(o[s.topic]||0)+1;return o;},{})).sort((a,b)=>b[1]-a[1]),frictions=Object.entries(list.reduce((o,s)=>{if(s.corr)o[s.fric||'其他']=(o[s.fric||'其他']||0)+s.corr;return o;},{})).sort((a,b)=>b[1]-a[1]),labels={git:'Git / PR',design:'产品设计',paper:'论文研究',data:'Agent 数据',quant:'数据分析',net:'网络配置',other:'其他探索'};return `<div class="stack"><div class="two equal"><section class="card pad">${titleHTML('高频反馈语','你如何表达需求与反馈')}<div class="note" style="margin-bottom:12px">非语义层 · 重复表达与协作瓶颈</div>${phrases.filter(p=>p.n).map(p=>`<div class="phrase-row"><span>“${p.name}”</span><b>${p.n} 次</b></div>`).join('')||'<p class="note">当前范围尚无重复反馈语。</p>'}</section><section class="card pad">${titleHTML('语义兴趣画像','你把注意力放在哪里')}<div class="note">语义层 · 根据会话主题聚合</div><div class="word-cloud">${topics.map(([key,n],i)=>`<span style="font-size:${Math.max(15,34-i*3)}px;color:${i<2?'var(--ink-1)':'var(--ink-3)'}" title="${n} 个会话">${labels[key]}</span>`).join('')}</div>${topics.slice(0,4).map(([key,n])=>`<div class="failure"><div class="row"><span>${TOPICS[key]}</span><span class="mono">${n} 会话</span></div><div class="bar"><i style="width:${n/list.length*100}%"></i></div></div>`).join('')}</section></div><section class="card pad">${titleHTML('纠偏与摩擦类型',`${st.corr} 条纠偏消息 · 纠偏率 ${f1(st.fric)}%`)}<div class="two equal"><div>${frictions.length?frictions.map(([name,n])=>`<div class="failure"><div class="row"><span>${esc(name)}</span><span class="mono">${n} · ${percent(n,st.corr)}</span></div><div class="bar"><i style="width:${n/st.corr*100}%"></i></div></div>`).join(''):'<p class="note">这段时间没有记录纠偏。</p>'}</div><div class="insight"><div class="row">${ic('spark')} 把反馈变成下一次的约定</div><p>${frictions.length?`「${esc(frictions[0][0])}」是当前最多的摩擦类型。把相关边界写入开场说明，在动手前先核对理解。`:'这段协作较顺畅。保留目前有效的目标表达与验收方式，作为自己的基准。'}</p><p class="note" style="margin-top:12px">纠偏是对任务的反馈，不等同于负面情绪。词频与类型均为示例标注。</p>${button('查看优化建议 '+ic('arrow'),'recommend','data-id="acceptance"','sm')}</div></div></section></div>`;};

/* 07 / Recommendations and preview */
function evidence(r){const xs=filtered(),st=stats(xs);switch(r.reason){case'friction':return xs.filter(s=>s.corr).length;case'errors':return xs.filter(s=>s.errors).length;case'git':return xs.filter(s=>s.topic==='git').length;case'design':return xs.filter(s=>s.topic==='design').length;case'verify':return xs.filter(s=>s.verify).length;case'tokens':return xs.filter(s=>s.tok>1e6).length;case'parallel':return xs.filter(s=>xs.some(t=>t!==s&&t.end-t.dur<s.end&&t.end>s.end-s.dur)).length;case'duration':return xs.filter(s=>s.dur>60).length;default:return st.n;}}
function recommendations(){return RECOMMENDATIONS.filter(r=>(S.dimension==='all'||r.dim===S.dimension)&&(S.agent==='all'||r.agents.includes(S.agent))).sort((a,b)=>(b.score+Math.min(10,evidence(b)/10))-(a.score+Math.min(10,evidence(a)/10)));}
function installKey(r,target=S.target){return r.id+':'+target;}
function configCode(r){return S.custom[installKey(r)]||`# 目标 Agent：${AGI[S.target].name}\n# Orbit 配置示意 / 实际接入前需适配 Agent 格式\n\n${r.code}`;}
function recCard(r,i){const n=evidence(r);return `<article class="card rec-card${S.rec===r.id?' selected':''}"><div class="row between"><span class="row"><span class="bdg">${r.type}</span><span class="rank">推荐 #${i+1}</span></span><span class="benefit">预计 ${r.gain}</span></div><h3>${r.title}</h3><p class="note">${r.desc}</p><div class="note">${n?'关联 '+n+' 个当前范围会话':'暂无相关会话证据 · 通用配置参考'}</div><div class="bottom"><span class="note">${r.agents.length===5?'适配所有 Agent':r.agents.map(id=>AGI[id].short).join(' · ')}</span>${button('预览并安装 '+ic('chevr'),'rec',`data-id="${r.id}"`,'sm')}</div></article>`;}
PAGES.recs=()=>{const items=recommendations();if(S.rec&&!items.some(r=>r.id===S.rec))S.rec=null;return `<div class="rec-tabs" role="group" aria-label="优化建议分类">${DIMS.map(([id,label])=>`<button class="chip${S.dimension===id?' on':''}" data-act="dimension" data-value="${id}" aria-pressed="${S.dimension===id}">${label}</button>`).join('')}</div><div class="row between note" style="margin:2px 0 16px"><span>${items.length} 项建议 · 按推荐程度排序</span><span>预计效果为演示估算，尚未验证</span></div>${items.length?`<div class="rec-layout${S.rec?' expanded':''}"><div class="rec-list">${items.map(recCard).join('')}</div>${S.rec?recDetail(REC[S.rec]):''}</div>`:empty('此分类暂无适配当前 Agent 的建议。')}`;};
